/* tokens.css */
/* ============================================================
   RMX Foundations tokens — GENERATED SHAPE, PARTIALLY VERIFIED
   ------------------------------------------------------------
   Naming rule (reproducible by scripts/sync.md):
     Figma variable path -> lowercase -> "/" becomes "-"
     -> drop a parent segment whose word already appears in the leaf
     -> collapse an immediately repeated word.
     Background/Button/primary-button  ->  --background-primary-button
     Text/text-primary                 ->  --text-primary
     Container/tertiary-dark           ->  --container-tertiary-dark

   Provenance:
     [M] measured off the live component library, 27 Aug 2026
     [N] name confirmed in RMX Foundations, VALUE NOT YET VERIFIED
         (carried from the v1 stylesheet — replace from the plugin export)

   Values marked [N] are the reason scripts/sync.md exists. Do not treat
   them as authoritative.
   ============================================================ */

:root {
  /* ---- Spacing (collection "1. Base") ---- */
  --spacing-none: 0px;    /* [M] */
  --spacing-xxs:  4px;    /* [M] */
  --spacing-xs:   8px;    /* [M] */
  --spacing-sm:  12px;    /* [M] */
  --spacing-md:  16px;    /* [M] */
  --spacing-lg:  20px;    /* [M] — confirmed on Header 18:2314 (Icon/User gap) */
  --spacing-xl:  24px;    /* [N] */
  --spacing-2xl: 32px;    /* [M] — confirmed on Header 18:2314 (Manage gap) */
  --spacing-3xl: 40px;    /* [N] */
  /* 4xl–9xl exist in Foundations; add them from the export. */

  /* ---- Radius ---- */
  --radius-sm:    4px;    /* [M] buttons, inputs, tiles, lozenges, toasts */
  --radius-lg:   12px;    /* [M] Pill */
  --radius-round: 999px;  /* [M] avatars, Add Photo (authored as 200) */

  /* ---- Text ---- */
  --text-primary:   #666666;  /* [M] default body/label gray */
  --text-secondary: #13314c;  /* [N] headings, entered values */
  --text-link:      #008dd5;  /* [N] clickable items ONLY — not labels */
  --text-label:     #008dd5;  /* [N] static labels above inputs; white in dark mode */
  --text-disabled:  #b3b3b3;  /* [N] also placeholder, which is additionally italic */
  --text-inverse:   #ffffff;  /* [M] — confirmed on Header 18:2314 (avatar initials) */
  --text-ondark:    #ffffff;  /* [M] — confirmed on Header 18:2314 */
  --text-onlight:   #13314c;  /* [N] */
  --text-error:     #eb343c;  /* [N] */
  --text-success:   #6eb744;  /* [N] */

  /* ---- Icon ---- */
  --icon-attention: #f58220;  /* [M] checked checkbox */
  --icon-brand:     #008dd5;  /* [N] */
  --icon-tertiary:  #666666;  /* [N] */
  --icon-notice:    #faa61c;  /* [N] */
  --icon-success:   #6eb744;  /* [N] */
  --icon-error:     #eb343c;  /* [N] */
  --icon-disabled:  #b3b3b3;  /* [N] */
  --icon-ondark:    #ffffff;  /* [N] */

  /* ---- Border ---- */
  --border-primary:   #cedbe7;  /* [M] the default hairline */
  --border-secondary: #008dd5;  /* [M] active / selected / focus, tile header underline, ACTIVE TAB */
  --border-disabled:  #ebf1f5;  /* [M] register row hairlines — production ships #CCCCCC, see notes */
  --border-attention: #f58220;  /* [M] checked checkbox stroke */

  /* ---- Background ---- */
  --background-ui-primary:   #f3f4f8;  /* [M] the page ground in Express */
  --background-ui-secondary: #f2f2f2;  /* [M] disabled / empty media */
  --background-card:         #ffffff;  /* [M] Dialog Overlay */
  --background-footer:       #f5f8fa;  /* [M] Overlay Footer */
  --background-tile:         #ffffff;  /* [M] Tile surface */
  --background-primary-button:   #008dd5;  /* [M] */
  --background-secondary-button: #ffffff;  /* [M] */
  --background-tertiary-button:  #f79b4d;  /* [M] the Marketing button */
  --background-brand-primary-disabled: rgba(0,141,213,.5); /* [N] */

  /* ---- Container ---- */
  --container-primary:        #ffffff;  /* [M] */
  --container-tertiary:       #f5f8fa;  /* [N] subtle surface */
  --container-tertiary-dark:  #737373;  /* [M] register header row */
  --container-secondary-dark: #13314c;  /* [M] Action Bar rail */
  --container-secondary:      #008dd5;  /* [M] avatar fill in the app bar, from node 18:2314 */

  /* ---- Component ---- */
  --component-main-header:          #13314c;  /* [M] app bar */
  --component-command-launch:       #425a70;  /* [M] app-bar icon buttons + Command Launch search field, from node 18:2314 */
  --component-context-header:       #008dd5;  /* [M] context bar */
  --component-input-default:        #f5f8fa;  /* [M] input fill */
  --component-input-secondary:      #ffffff;  /* [M] Orion input fill */
  --component-register-row-default: #ffffff;  /* [M] Cell fill */
  --component-row-selected:         #e8f6fa;  /* [M] */
  --component-lozenge-success:      #e2f1da;  /* [M] */
  --component-lozenge-error:        #fbd6d8;  /* [N] */
  --component-lozenge-brand:        #cce8f7;  /* [N] */
  --component-lozenge-caution:      #feedd2;  /* [N] note: Caution, not "notice" */
  --component-toast-brand:          #008dd5;  /* [M] Toast State=Action, Bulk Action */
  --component-toast-success:        #6eb744;  /* [M] Reminder */

  /* ---- Layout ---- */
  --content-contentpadding: 16px;   /* [M] context bar side padding */
  --display-display:      1920px;   /* [M] full-bleed bar width */
  --cell-height:            36px;   /* [M] authored as "Cell/Cell Heigth" (sic) */

  /* ---- Orion (not Foundations variables — measured off components) ---- */
  --orion-border-gradient: linear-gradient(90deg, #008dd5, #6eb744); /* [M] a BORDER, not a fill */
  --orion-glow:   0 0 12.6px rgba(0,141,213,.20);  /* [M] Action Bar */
  --orion-glow-lg:0 0 12.6px rgba(0,141,213,.25);  /* [M] Overlay */
  --orion-radius-overlay: 8px;   /* [M] */
  --orion-radius-bar:    24px;   /* [M] */
}

/* type.css */
/* ============================================================
   RMX type scale - HARVESTED FROM RMX FOUNDATIONS, DO NOT EDIT BY HAND
   ------------------------------------------------------------
   Source of truth: data/text-styles.json. Every style below is a real
   named text style. audit.mjs fails any text that is not one of them.
   ============================================================ */

/* A weight the browser has not actually loaded is silently synthesised —
   600 renders as fake Bold while getComputedStyle still reports 600.
   Turning synthesis off makes a missing face visibly wrong, not quietly wrong. */
html { font-synthesis-weight: none; font-synthesis-style: none; }

:root {
  --type-display-xl: 400 96px/normal Roboto, sans-serif;   /* Web/Display/XL - Onboarding */
  --type-display-l-semibold: 600 56px/64px Roboto, sans-serif;   /* Web/Display/L/SemiBold - Used for styled splash pages. */
  --type-display-s-semibold: 600 40px/48px Roboto, sans-serif;   /* Web/Display/S/SemiBold */
  --type-heading-xl-semibold: 600 32px/40px Roboto, sans-serif;   /* Web/Heading/XL/SemiBold */
  --type-heading-xl-medium: 500 32px/40px Roboto, sans-serif;   /* Web/Heading/XL/Medium */
  --type-heading-l-semibold: 600 24px/32px Roboto, sans-serif;   /* Web/Heading/L/SemiBold */
  --type-heading-l-medium: 500 24px/32px Roboto, sans-serif;   /* Web/Heading/L/Medium */
  --type-heading-l-regular: 400 24px/32px Roboto, sans-serif;   /* Web/Heading/L/Regular */
  --type-heading-m-semibold: 600 20px/28px Roboto, sans-serif;   /* Web/Heading/M/SemiBold */
  --type-heading-m-medium: 500 20px/28px Roboto, sans-serif;   /* Web/Heading/M/Medium */
  --type-heading-m-regular: 400 20px/28px Roboto, sans-serif;   /* Web/Heading/M/Regular */
  --type-heading-s-semibold: 600 18px/24px Roboto, sans-serif;   /* Web/Heading/S/SemiBold */
  --type-heading-s-regular: 400 18px/24px Roboto, sans-serif;   /* Web/Heading/S/Regular */
  --type-paragraph-l-semibold: 600 16px/24px Roboto, sans-serif;   /* Web/Paragraph/L/SemiBold */
  --type-paragraph-l-medium: 500 16px/24px Roboto, sans-serif;   /* Web/Paragraph/L/Medium */
  --type-paragraph-l-regular: 400 16px/24px Roboto, sans-serif;   /* Web/Paragraph/L/Regular */
  --type-paragraph-s-semibold: 600 14px/20px Roboto, sans-serif;   /* Web/Paragraph/S/SemiBold */
  --type-paragraph-s-regular: 400 14px/20px Roboto, sans-serif;   /* Web/Paragraph/S/Regular - Body text for most use cases. */
  --type-paragraph-s-italic: italic 400 14px/20px Roboto, sans-serif;   /* Web/Paragraph/S/Italic - Use italics to give emphasis. */
  --type-paragraph-s-special-underline: 400 14px/20px Roboto, sans-serif;   /* Web/Paragraph/S/Special/Underline - Use for links on hover. */
  --type-label-l-semibold: 600 16px/normal Roboto, sans-serif;   /* Web/Label/L/SemiBold */
  --type-label-l-medium: 500 16px/normal Roboto, sans-serif;   /* Web/Label/L/Medium - Used sparingly */
  --type-label-l-regular: 400 16px/normal Roboto, sans-serif;   /* Web/Label/L/Regular */
  --type-label-l-italic: italic 400 16px/normal Roboto, sans-serif;   /* Web/Label/L/Italic - Used to show emphasis. */
  --type-label-m-semibold: 600 14px/normal Roboto, sans-serif;   /* Web/Label/M/SemiBold */
  --type-label-m-regular: 400 14px/normal Roboto, sans-serif;   /* Web/Label/M/Regular */
  --type-label-m-italic: italic 400 14px/normal Roboto, sans-serif;   /* Web/Label/M/Italic - Used to show emphasis. */
  --type-label-s-semibold: 600 12px/normal Roboto, sans-serif;   /* Web/Label/S/SemiBold - Used sparingly */
  --type-label-s-regular: 400 12px/normal Roboto, sans-serif;   /* Web/Label/S/Regular */
  --type-label-s-italic: italic 400 12px/normal Roboto, sans-serif;   /* Web/Label/S/Italic - Used as placeholder text */
  --type-label-s-medium: 500 12.600000381469727px/normal Roboto, sans-serif;   /* Web/Label/S/Medium - This style is used specifically for the Register Headers. */  /* + letter-spacing: 1.134px */
}

/* One class per style. Prefer these over ad-hoc font declarations. */

.rmx-type-paragraph-s-regular { font: var(--type-paragraph-s-regular); }
.rmx-type-paragraph-s-italic { font: var(--type-paragraph-s-italic); }

/* rmx.css */
/* ============================================================
   RMX recipes — consumes assets/tokens.css. NO literal colours here.
   Every class is namespaced rmx- so scripts/audit.mjs can find them
   and so prototypes never collide with page styles.

   Pair with:
   <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

   Icons: RMX uses a Flexible Icon component, not raw Material glyphs.
   In HTML, use inline <svg> — see references/controls.md. Do NOT load
   an icon font by ligature; it degrades to visible words offline.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

body.rmx {
  margin: 0;
  font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px; line-height: 20px;
  color: var(--text-primary);
  background: var(--background-ui-primary);
}

/* ---------- Typography (Text Placeholder equivalents) ---------- */
.rmx-text            { font-size: 14px; line-height: 20px; color: var(--text-primary); }
.rmx-text--semibold  { font-weight: 600; color: var(--text-secondary); }
.rmx-text--link      { color: var(--text-link); cursor: pointer; }
.rmx-text--link:hover{ text-decoration: underline; }
.rmx-text--label     { color: var(--text-primary); }
/* Text Style=Italic Disabled — the ONLY use of italic gray */
.rmx-placeholder     { font-style: italic; color: var(--text-disabled); }
.rmx-h1 { font: 400 24px/32px Roboto, sans-serif; color: var(--text-secondary); margin: 0; }
.rmx-h2 { font: 400 20px/28px Roboto, sans-serif; color: var(--text-secondary); margin: 0; }
.rmx-h3 { font: 600 16px/24px Roboto, sans-serif; color: var(--text-secondary); margin: 0; }

/* ---------- Button ---------- */
.rmx-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--spacing-xxs);
  height: 36px; padding: var(--spacing-xs) var(--spacing-md);
  border: 1px solid transparent; border-radius: var(--radius-sm);
  font: var(--type-label-m-regular);   /* Web/Label/M/Regular - 14/400, NOT 500 */ cursor: pointer; white-space: nowrap;
}
.rmx-btn--primary   { background: var(--background-primary-button); color: var(--text-inverse); }
.rmx-btn--secondary { background: var(--background-secondary-button); color: var(--text-link);
                      border-color: var(--border-secondary); }
.rmx-btn--secondary:hover { background: var(--border-disabled); }
.rmx-btn--text      { background: transparent; color: var(--text-link); padding: 0 var(--spacing-xs); }
.rmx-btn--marketing { background: var(--background-tertiary-button); color: var(--text-secondary);
                      width: 296px; height: 48px; font-size: 16px; }
.rmx-btn--compact   { height: 24px; padding: 0 var(--spacing-xs); }
.rmx-btn:disabled   { background: var(--background-brand-primary-disabled); cursor: default; }

/* Split Button — two segments, 1px inverse divider, trailing caret segment.
   v1 declared this component and never implemented it. */
.rmx-split { display: inline-flex; height: 36px; border-radius: var(--radius-sm); overflow: hidden; }
.rmx-split > .rmx-split__main {
  display: inline-flex; align-items: center; gap: var(--spacing-xxs);
  padding: 0 var(--spacing-md); background: var(--background-primary-button);
  color: var(--text-inverse); font: var(--type-label-m-regular);   /* Web/Label/M/Regular - 14/400, NOT 500 */ border: 0; cursor: pointer;
}
.rmx-split > .rmx-split__caret {
  width: 24px; display: inline-flex; align-items: center; justify-content: center;
  background: var(--background-primary-button); color: var(--text-inverse);
  border: 0; border-left: 1px solid var(--container-primary); cursor: pointer;
}

/* ---------- Input Field (static-prototype safe: works on a div) ---------- */
.rmx-field { display: flex; flex-direction: column; gap: var(--spacing-xxs); width: 248px; }
.rmx-field > .rmx-field__label { font-size: 14px; color: var(--text-primary); }
.rmx-field--filter > .rmx-field__label { color: var(--text-label); }
.rmx-field__box {
  display: flex; align-items: center; gap: var(--spacing-xs);
  height: 36px; padding: var(--spacing-xs);
  background: var(--component-input-default);
  border: 1px solid var(--border-primary); border-radius: var(--radius-sm);
  color: var(--text-secondary); font-size: 14px;
}
.rmx-field__box:focus-within { border-color: var(--border-secondary); }
.rmx-field__box > input { all: unset; flex: 1; min-width: 0; color: inherit; font: inherit; }
.rmx-field__box > input::placeholder { font-style: italic; color: var(--text-disabled); }

/* ---------- Checkbox / Radio ---------- */
.rmx-check { display: inline-flex; align-items: center; gap: var(--spacing-xs); cursor: pointer; }
.rmx-check__box {
  width: 20px; height: 20px; flex: none; border-radius: 2px;
  border: 2px solid var(--icon-disabled); background: var(--container-primary);
  display: inline-flex; align-items: center; justify-content: center;
}
/* Checked is ORANGE — icon-attention #F58220. v1's stylesheet used the
   marketing orange #F79B4D, which is a different token. */
.rmx-check[data-checked="true"] .rmx-check__box {
  background: var(--icon-attention); border-color: var(--border-attention);
}
.rmx-check[data-checked="true"] .rmx-check__box > svg { color: var(--container-primary); }
/* State=Blue / State=Register — the select-all above a register */
.rmx-check--blue[data-checked="true"] .rmx-check__box,
.rmx-check--register[data-checked="true"] .rmx-check__box {
  background: var(--border-secondary); border-color: var(--border-secondary);
}
.rmx-radio__dot {
  width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--icon-disabled);
  display: inline-flex; align-items: center; justify-content: center;
}
.rmx-radio[data-checked="true"] .rmx-radio__dot { border-color: var(--border-secondary); }
.rmx-radio[data-checked="true"] .rmx-radio__dot::after {
  content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--border-secondary);
}

/* ---------- Tabs — ONE definition. Active underline is BLUE. ---------- */
.rmx-tab {
  padding: var(--spacing-md) var(--spacing-xs);
  font: 600 14px/1 Roboto, sans-serif; color: var(--text-primary);
  background: transparent;                      /* never a fill */
  border: 0; border-bottom: 2px solid transparent;
  cursor: pointer;
}
.rmx-tab[aria-selected="true"] {
  color: var(--text-secondary);
  border-bottom-color: var(--border-secondary);  /* #008DD5, 2px */
  background: transparent;
}
.rmx-tabrow { display: flex; align-items: flex-start; }

/* ---------- Lozenge / Pill ---------- */
.rmx-lozenge {
  display: inline-flex; align-items: center; gap: var(--spacing-xs);
  height: 24px; padding: var(--spacing-xxs) var(--spacing-xs);
  border-radius: var(--radius-sm); font-size: 14px; color: var(--text-secondary);
}
.rmx-lozenge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
.rmx-lozenge--success { background: var(--component-lozenge-success); }
.rmx-lozenge--success::before { background: var(--icon-success); }
.rmx-lozenge--error   { background: var(--component-lozenge-error); }
.rmx-lozenge--error::before { background: var(--icon-error); }
.rmx-lozenge--brand   { background: var(--component-lozenge-brand); }
.rmx-lozenge--brand::before { background: var(--icon-brand); }
.rmx-lozenge--caution { background: var(--component-lozenge-caution); }
.rmx-lozenge--caution::before { background: var(--icon-notice); }
.rmx-lozenge--status  { background: transparent; font-style: italic; padding: 0; }
.rmx-lozenge--status::before { display: none; }
.rmx-lozenge--32 { height: 32px; }
.rmx-pill {
  display: inline-flex; align-items: center; gap: var(--spacing-xxs);
  height: 20px; padding: 0 var(--spacing-xs);
  border-radius: var(--radius-lg);                /* Radius/lg — legitimately round */
  background: var(--container-primary); border: 1px solid var(--border-secondary);
  font-size: 14px; color: var(--text-secondary);
}

/* ---------- Register: Header + Cell + Cell Content ---------- */
.rmx-register { width: 100%; border-collapse: collapse; background: var(--container-primary); }
/* Header Style=Register — full-page, gray */
.rmx-register th { font: var(--type-label-s-medium); letter-spacing: 1.134px;
  height: 28px; padding: var(--spacing-xxs) var(--spacing-xs);
  background: var(--container-tertiary-dark); color: var(--text-inverse);
  font: 500 12.6px/1 Roboto, sans-serif; letter-spacing: 1.1px; text-align: left;
  border-right: .5px solid var(--container-primary); white-space: nowrap;
}
.rmx-register th:last-child { border-right: 0; }
/* Header Style=Table — embedded in a Tile, white */
.rmx-register--table th {
  height: 32px; background: var(--container-primary); color: var(--text-secondary);
  border-top: 1px solid var(--border-primary); border-bottom: 1px solid var(--border-primary);
  border-right: 0;
}
/* Cell */
.rmx-register td {
  height: var(--cell-height); padding: 0 var(--spacing-xs);
  background: var(--component-register-row-default); color: var(--text-secondary);
  border-top: 1px solid var(--border-disabled); border-bottom: 1px solid var(--border-disabled);
  font-size: 14px;
}
.rmx-register tr[data-striped="true"] td { background: var(--container-tertiary); }
.rmx-register__totals { padding-top: var(--spacing-xs); text-align: right; font-size: 12px; color: var(--text-disabled); }
.rmx-colorblock { display: block; width: 10px; height: var(--cell-height); }

/* ---------- Tile ---------- */
.rmx-tile {
  display: flex; flex-direction: column;
  background: var(--background-tile);
  border: 1px solid var(--border-primary); border-radius: var(--radius-sm);
}
.rmx-tile__header {
  display: flex; align-items: center; gap: var(--spacing-xs);
  min-height: 36px; padding: var(--spacing-xs);
  border-bottom: 2px solid var(--border-secondary);
}
.rmx-tile__title { font: 600 14px/1 Roboto, sans-serif; color: var(--text-secondary); }
.rmx-tile__actions { margin-left: auto; display: flex; align-items: center; gap: var(--spacing-xs); }
.rmx-tile__body { padding: var(--spacing-md); display: flex; flex-direction: column; gap: var(--spacing-md); flex: 1; }
.rmx-fieldgrid { display: flex; gap: var(--spacing-xl); }
.rmx-fieldgrid__col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--spacing-md); }
.rmx-ro { display: flex; flex-direction: column; }
.rmx-ro__label { font-size: 14px; color: var(--text-primary); }
.rmx-ro__value { font: 600 14px/20px Roboto, sans-serif; color: var(--text-secondary); }
.rmx-ro__value--link { color: var(--text-link); }

/* ---------- Scoreboard Header ---------- */
.rmx-scoreboard {
  display: flex; min-height: 64px;
  background: var(--container-primary);
  border: 1px solid var(--border-primary); border-radius: var(--radius-sm); overflow: hidden;
}
.rmx-scoreboard__bar { width: 16px; flex: none; background: var(--container-secondary-dark); }
.rmx-scoreboard__content {
  flex: 1; display: flex; align-items: center; gap: var(--spacing-2xl);
  padding: 0 var(--spacing-md);
}

/* ---------- Page chrome ---------- */
/* ---------- App bar (Header, Use=Default) ----------
   Harvested from RMX Components node 18:2314. Do not restyle, do not rebuild.

   The structure is the part that kept going wrong: it is THREE EQUAL COLUMNS
   (flex:1 0 0 each), not a row with margin-left:auto. The search bar lands
   centred because its column is centred — reproduce it any other way and the
   bar is subtly wrong on every screen.

   The icon cluster belongs INSIDE the Command Launch column, left of the
   search field. It is a segmented control on --component-command-launch with
   1px gaps, rounded only on the outer ends — not three outlined buttons. */
.rmx-appbar {
  display: flex; align-items: center; overflow: clip;
  height: 48px;
  /* --display-display (1920) is the Figma CANVAS width, not a CSS rule. Pinning
     the bar to it made every screen scroll horizontally below 1920, including
     at 1440. The bar is full-bleed and fluid; 1920 is the width it was
     MEASURED at, and the three columns keep their proportions at any width. */
  width: 100%; min-width: 960px;
  padding: var(--spacing-xs) var(--spacing-md);
  background: var(--component-main-header); color: var(--text-ondark);
}
.rmx-appbar__leading,
.rmx-appbar__launch,
.rmx-appbar__manage { flex: 1 0 0; min-width: 1px; display: flex; align-items: center; }
.rmx-appbar__leading { gap: var(--spacing-md); }
.rmx-appbar__launch  { gap: var(--spacing-xs); justify-content: center; }
.rmx-appbar__manage  { gap: var(--spacing-2xl); justify-content: flex-end; padding-block: 1px; }

/* The real Rent Manager logo, node 9671:2926 — 175x32, currentColor so it
   takes --text-ondark. Never set the brand as a text span. */
.rmx-appbar__logo { width: 175px; height: 32px; flex: none; fill: currentColor; }
.rmx-appbar__logo--mark { display: none; }

.rmx-appbar__icons { display: flex; align-items: center; gap: 1px; }
.rmx-appbar__icons > button {
  height: 32px; border: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: var(--component-command-launch); color: var(--text-ondark);
}
.rmx-appbar__icons > button:first-child {
  width: 39.02px;
  border-radius: var(--radius-sm) 0 0 var(--radius-sm);
}
.rmx-appbar__icons > button:nth-child(2) { width: 45.03px; padding: 6px 13px; }
.rmx-appbar__icons > button:last-child {
  width: 38.02px; padding: 6px 9px;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

/* Command Launch search — 454px, and its placeholder is Web/Label/S/Italic
   (12px italic, text-ondark), not the 14px regular of a normal Input Field. */
.rmx-appbar__search {
  display: flex; align-items: center; gap: var(--spacing-xs);
  /* 454px is its measured width at 1920. It may shrink below that rather than
     force the bar to overflow; it never grows past it. */
  width: 454px; max-width: 100%; min-width: 0; flex: 0 1 454px;
  height: 32px; overflow: clip;
  padding: 14px var(--spacing-xs);
  border-radius: var(--radius-sm);
  background: var(--component-command-launch);
}
.rmx-appbar__search > .rmx-icon { width: 24px; height: 24px; flex: none; }
.rmx-appbar__search > input {
  all: unset; flex: 1; min-width: 0;
  font: var(--type-label-s-italic); color: var(--text-ondark);
}
.rmx-appbar__search > input::placeholder { color: var(--text-ondark); opacity: 1; }

.rmx-appbar__code { display: flex; flex-direction: column; color: var(--text-ondark); }
.rmx-appbar__code > :first-child { font: var(--type-label-s-regular); }
.rmx-appbar__code > :last-child  { font: var(--type-label-m-regular); }

.rmx-appbar__user { display: flex; align-items: center; justify-content: flex-end; gap: var(--spacing-lg); }
.rmx-appbar__avatar {
  width: 32px; height: 32px; border-radius: var(--radius-round);
  display: flex; align-items: center; justify-content: center;
  background: var(--container-secondary); color: var(--text-inverse, #fff);
  font: var(--type-label-m-regular);
}
/* ---------- Context Bar ----------
   Harvested from node 10861:12222. Two slots, justify-between: leading items
   left, trailing items right. Both slots gap 12px (--spacing-sm), NOT 16.
   The page title is Web/Heading/S/Regular (18/24) in --text-inverse; trailing
   items are 20px icons. */
.rmx-contextbar {
  display: flex; align-items: center; justify-content: space-between;
  height: 40px; width: 100%; min-width: 960px; overflow: clip;
  padding: var(--spacing-xs) var(--content-contentpadding);
  background: var(--component-context-header); color: var(--text-inverse);
}
.rmx-contextbar__leading,
.rmx-contextbar__trailing { display: flex; align-items: center; gap: var(--spacing-sm); overflow: clip; }
.rmx-contextbar__trailing { justify-content: flex-end; }
.rmx-contextbar__trailing .rmx-icon { width: 20px; height: 20px; }
.rmx-contextbar__title { font: var(--type-heading-s-regular); color: var(--text-inverse); }
/* A white field inside the blue bar must not inherit white text.
   This is the cascade bug that made v1's entity field invisible. */
.rmx-contextbar .rmx-field__box,
.rmx-contextbar .rmx-field__box > input { color: var(--text-secondary); }
.rmx-actionbar {
  width: 40px; flex: none; display: flex; flex-direction: column; align-items: center;
  gap: var(--spacing-md); padding: var(--spacing-md) var(--spacing-xs);
  background: var(--container-secondary-dark); color: var(--text-ondark);
}
.rmx-shell { display: flex; align-items: stretch; min-height: calc(100vh - 88px); }
.rmx-page { max-width: 100%; flex: 1; min-width: 0; padding: var(--spacing-md) var(--spacing-xl); background: var(--container-primary); }
.rmx-filterrow { display: flex; align-items: flex-end; gap: var(--spacing-xs); padding-bottom: var(--spacing-sm); }
.rmx-filterrow__actions { margin-left: auto; display: flex; gap: var(--spacing-xs); }

/* ---------- Feedback: three DIFFERENT components ---------- */
/* Callout — always outlined, 40px. Type = Default | Help | Error | Warning */
.rmx-callout {
  display: flex; align-items: center; gap: var(--spacing-xs);
  min-height: 40px; padding: var(--spacing-xs); border-radius: var(--radius-sm);
  background: var(--container-primary); border: 1px solid var(--border-secondary);
  font: 600 14px/20px Roboto, sans-serif; color: var(--text-secondary);
}
.rmx-callout--warning { border-color: var(--border-attention); }
.rmx-callout--error   { border-color: var(--text-error); }
/* Bulk Action — the FILLED banner above a register. Blue, not navy. */
.rmx-bulkaction {
  display: flex; align-items: center; gap: var(--spacing-xs);
  height: 48px; padding: 0 var(--spacing-md); border-radius: var(--radius-sm);
  background: var(--component-toast-brand); color: var(--text-inverse);
}
/* Toast — State = Success | Action | Failure. Action (blue) is the default. */
.rmx-toast {
  display: flex; align-items: center; gap: var(--spacing-xs);
  padding: var(--spacing-md); border-radius: var(--radius-sm);
  background: var(--component-toast-brand); color: var(--text-inverse);
  font: 600 16px/24px Roboto, sans-serif;
  box-shadow: 0 3px 6px rgba(0,0,0,.25);
}
.rmx-toast--success { background: var(--component-toast-success); }
.rmx-toast--failure { background: var(--text-error); }
/* Reminder — the green surface belongs here, not to Toast. */
.rmx-reminder {
  display: flex; gap: var(--spacing-md); width: 376px; padding: var(--spacing-md);
  border-radius: var(--radius-sm); background: var(--component-toast-success); color: var(--text-inverse);
}

/* ---------- Overlays ---------- */
.rmx-overlay { background: var(--background-card); border: 1px solid var(--border-primary);
               border-radius: var(--radius-sm); overflow: hidden; }
.rmx-overlay__header { display: flex; align-items: center; height: 48px; padding: 0 var(--spacing-md);
  background: var(--container-primary); border-bottom: 1px solid var(--border-primary);
  font: 400 16px/24px Roboto, sans-serif; color: var(--text-secondary); }
.rmx-overlay__footer { display: flex; align-items: center; justify-content: flex-end; gap: var(--spacing-xs);
  height: 52px; padding: 0 var(--spacing-md);
  background: var(--background-footer); border-top: 1px solid var(--border-primary); }

/* ---------- Board card + swim lane ---------- */
.rmx-boardcard {
  width: 272px; min-height: 128px; display: flex;
  background: var(--container-primary); border-radius: var(--radius-sm);
  box-shadow: 0 0 2.5px rgba(76,76,76,.05), 0 -2px 10px rgba(76,76,76,.06), 0 10px 5px rgba(76,76,76,.15);
}
.rmx-boardcard__bar { width: 8px; flex: none; border-radius: var(--radius-sm) 0 0 var(--radius-sm); }

/* ---------- Orion — the gradient is a BORDER, not a fill ---------- */
.rmx-orion-surface {
  background: var(--container-primary);
  border-radius: var(--orion-radius-overlay);
  box-shadow: var(--orion-glow-lg);
  border: 1px solid transparent;
  background-image: linear-gradient(var(--container-primary), var(--container-primary)), var(--orion-border-gradient);
  background-origin: border-box;
  background-clip: padding-box, border-box;
}
.rmx-orion-bar {
  min-height: 52px; border-radius: var(--orion-radius-bar);
  box-shadow: var(--orion-glow);
  border: 1px solid transparent;
  background-image: linear-gradient(var(--background-ui-primary), var(--background-ui-primary)), var(--orion-border-gradient);
  background-origin: border-box; background-clip: padding-box, border-box;
}
.rmx-orion-tag {
  display: inline-flex; align-items: center; gap: var(--spacing-xxs);
  height: 20px; padding: 0 var(--spacing-xs); border-radius: var(--radius-sm);
  background: var(--container-primary); font-size: 12px; color: var(--text-secondary);
  border: 1px solid transparent;
  background-image: linear-gradient(var(--container-primary), var(--container-primary)), var(--orion-border-gradient);
  background-origin: border-box; background-clip: padding-box, border-box;
}

/* Icons: sized boxes for inline SVG. */
/* The harvested icons are FILL-based (the library exports filled paths, not
   strokes). Without fill:currentColor they render solid black — invisible on
   the navy app bar, muddy everywhere else. */
.rmx-icon { width: 20px; height: 20px; flex: none; display: inline-block; fill: currentColor; }
.rmx-icon--16 { width: 16px; height: 16px; }
.rmx-icon--24 { width: 24px; height: 24px; }

/* ---------- Action button underline ----------
   The underlined state belongs to the LABEL, never to an icon sitting next to
   it. text-decoration inherits into inline SVG children and draws a stray rule
   under the glyph, which reads as a rendering bug. */
.rmx-btn__label { text-decoration: inherit; }
.rmx-btn--text:hover .rmx-btn__label,
.rmx-btn--underline .rmx-btn__label { text-decoration: underline; }
.rmx-btn--text:hover,
.rmx-btn--underline { text-decoration: none; }
.rmx-btn .rmx-icon,
.rmx-text--link .rmx-icon { text-decoration: none; }

/* proto.css */
/* RMX prototype-only styles — the same file in every prototype.

   Everything here is scaffolding that a real Express screen would not need:
   the scrim behind an overlay, the toast stack, the dropdown panel, the
   screen index. It is separate from rmx.css so it stays obvious what is the
   design system and what is prototype plumbing — a developer handed this
   deletes proto.css and keeps rmx.css.

   Tokens only. No hex values. */

/* ---- overlays ---- */
.rmx-scrim {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .32);
  z-index: 900;
}

.rmx-overlay.is-open,
[data-rmx-panel].is-open {
  position: fixed;
  z-index: 950;
}

.rmx-overlay.is-open {
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-height: calc(100vh - 96px);
  overflow: auto;
}

/* A side panel slides from the right rather than sitting centred. */
[data-rmx-panel].is-open {
  top: 0;
  right: 0;
  bottom: 0;
  width: 480px;
  background: var(--background-primary, #fff);
  border-left: 1px solid var(--border-primary);
  display: flex;
  flex-direction: column;
  overflow: auto;
}

/* ---- dropdown panel ----
   The floating half of a dropdown. The trigger is an Input Field, styled by
   rmx.css. Never a native <select>. */
[data-rmx-dropdown] {
  position: relative;
}

.rmx-menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  min-width: 100%;
  z-index: 800;
  background: var(--background-primary, #fff);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm, 4px);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
  padding: var(--spacing-xxs, 4px) 0;
  max-height: 320px;
  overflow: auto;
}

.rmx-menu > [data-value] {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  font: inherit;
  color: var(--text-primary);
  padding: 0 var(--spacing-sm, 12px);
  height: 32px;
  line-height: 32px;
  cursor: pointer;
}

.rmx-menu > [data-value]:hover {
  background: var(--background-ui-primary);
}

.rmx-menu > [data-value][aria-selected="true"] {
  font-weight: 500;
  color: var(--text-link);
}

[data-rmx-dropdown][data-open="true"] [data-rmx-trigger] .rmx-icon {
  transform: rotate(180deg);
}

/* ---- toasts ---- */
.rmx-toaststack {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-xs, 8px);
  align-items: center;
  pointer-events: none;
}

/* ---- sortable register headers ---- */
.rmx-register th[data-sort] {
  cursor: pointer;
  user-select: none;
}

.rmx-register th[data-dir]::after {
  content: "";
  display: inline-block;
  margin-left: var(--spacing-xxs, 4px);
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
}

.rmx-register th[data-dir="asc"]::after  { border-bottom: 4px solid currentColor; }
.rmx-register th[data-dir="desc"]::after { border-top: 4px solid currentColor; }

/* ---- screen index (index.html only) ---- */
.rmx-index {
  padding: 32px;
  max-width: 860px;
}

.rmx-index__list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-xs, 8px);
}

.rmx-index__item {
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm, 4px);
  background: var(--background-primary, #fff);
  padding: 12px var(--spacing-md, 16px);
}

.rmx-index__note {
  color: var(--text-tertiary);
  margin: var(--spacing-xxs, 4px) 0 0;
}

/* ---- utilities ---- */
[hidden] { display: none !important; }

.rmx-icon { transition: transform .12s ease; }

:focus-visible {
  outline: 2px solid var(--border-secondary);
  outline-offset: 1px;
}

/* responsive.css */
/* ============================================================
   RMX responsive — PROTOTYPE CONVENTIONS, NOT LIBRARY TRUTH
   ------------------------------------------------------------
   RMX Foundations defines exactly ONE width: --display-display,
   1920px. There are no breakpoint tokens and no Mobile / Tablet /
   Narrow variants on any of the 130 components. Everything in the
   library is authored at 1920.

   So every rule in this file is a decision taken for prototypes,
   agreed with Emma on 2026-09-10 — not a value harvested from
   Figma. If the design system later defines responsive behaviour,
   THAT wins and this file is replaced.

   Read references/responsive.md before changing anything here.

   Breakpoints (named after what they are for, not after devices):
     >= 1280   desktop   as authored; nothing collapses
     1024-1279 laptop    fluid, search shrinks, nothing hides
      768-1023 tablet    secondary chrome hides, page padding drops
      < 768    phone     single column, app bar reduced to essentials
   ============================================================ */

:root {
  --bp-laptop: 1280px;
  --bp-tablet: 1024px;
  --bp-phone: 768px;
}

/* The bars are full-bleed and fluid at every width. 1920 is what they
   were measured at, never a floor. */
.rmx-appbar,
.rmx-contextbar { min-width: 0; }

/* ---------- 1024–1279 · laptop ----------
   Nothing hides. The Command Launch search gives up width first, because
   it is the only element in the bar with slack. */
@media (max-width: 1279px) {
  .rmx-appbar__search { flex: 0 1 380px; }
}

/* ---------- 768–1023 · tablet ----------
   DECISION: Company Code is the first thing to go. It is reference
   information, not navigation, and it is the widest low-value block in
   the Manage column. The avatar and bell stay — they are wayfinding. */
@media (max-width: 1023px) {
  .rmx-appbar__code { display: none; }
  .rmx-appbar__search { flex: 0 1 280px; }
  .rmx-appbar__manage { gap: var(--spacing-md); }
  .rmx-page { padding-inline: var(--spacing-md); }
  .rmx-shell { display: block; }

  /* DECISION: the 40px Action Bar rail becomes a horizontal strip under
     the context bar rather than a side rail, which would eat a fifth of
     a tablet's width. */
  .rmx-actionbar {
    width: 100%; flex-direction: row; justify-content: flex-end;
    padding: var(--spacing-xs) var(--spacing-md);
    border-bottom: 1px solid var(--border-primary);
  }

  /* Tiles stop sitting side by side. */
  .rmx-tilerow, .rmx-fieldgrid { flex-direction: column; }
  .rmx-fieldgrid__col { width: 100%; }
}

/* ---------- < 768 · phone ----------
   DECISION: the app bar keeps logo, search and avatar. The icon cluster
   (Mega Menu / Reports / Favorites) hides — all three are shortcuts that
   also exist elsewhere, and at this width the search is what people use.
   The three columns stop being equal thirds, because equal thirds at
   375px leaves the search unusable. */
@media (max-width: 767px) {
  .rmx-appbar { padding-inline: var(--spacing-sm); gap: var(--spacing-xs); }
  .rmx-appbar__icons { display: none; }
  .rmx-appbar__leading { flex: 0 0 auto; }
  .rmx-appbar__launch { flex: 1 1 auto; }
  .rmx-appbar__manage { flex: 0 0 auto; }
  /* Swap the full lockup for the roof mark. Scaling the 175px lockup down to
     32 makes an illegible smudge; the mark is the same artwork, cropped. */
  .rmx-appbar__logo { display: none; }
  .rmx-appbar__logo--mark[hidden] { display: block !important; width: 32px; }
  .rmx-appbar__search { flex: 1 1 auto; min-width: 0; }

  .rmx-contextbar { padding-inline: var(--spacing-sm); }
  .rmx-page { padding-inline: var(--spacing-sm); }

  /* A dialog at 520px does not fit 375. Overlays go near-full-bleed. */
  .rmx-overlay.is-open {
    width: calc(100vw - 24px) !important;
    max-width: calc(100vw - 24px);
    max-height: calc(100vh - 48px);
  }
  [data-rmx-panel].is-open { width: 100%; }

  /* Filter rows wrap instead of overflowing. */
  .rmx-filterrow { flex-wrap: wrap; }
  .rmx-field { width: 100%; }
}

/* ---------- Registers ----------
   DECISION (Emma, 2026-09-10): columns shrink until they cannot, then
   truncate with an ellipsis. The register does NOT get its own sideways
   scroll, and no column is hidden — hiding one would need a priority
   order per screen, which is a per-design decision, not a global rule.

   Cells keep their 36px height and 14px type at every width: those are
   system rules and do not flex. */
.rmx-register { table-layout: auto; }
.rmx-register th,
.rmx-register td {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* A truncated cell must still be readable on hover/focus for a prototype
   to be testable — this reveals the full value without changing layout. */
.rmx-register td[title]:hover { cursor: help; }

@media (max-width: 1023px) {
  .rmx-register th,
  .rmx-register td { max-width: 180px; }
}
@media (max-width: 767px) {
  .rmx-register th,
  .rmx-register td { max-width: 120px; padding-inline: var(--spacing-xs); }
}

/* Anything genuinely un-shrinkable scrolls inside its own box rather than
   pushing the page sideways. */
.rmx-tile__body { max-width: 100%; overflow-x: auto; }

/* orion.css */
/* ============================================================
   Orion Assistant — this prototype's own stylesheet
   ------------------------------------------------------------
   Loaded AFTER proto.css, and deliberately not part of it: check.mjs owns
   the seven foundation files (tokens, type, rmx, proto, responsive, app.js,
   icons.svg) and refreshes any that drift from the skill, so anything
   written into proto.css is lost on the next check. Prototype-specific
   styling belongs here instead.
   ============================================================ */

/* ============================================================
   Sections
   ------------------------------------------------------------
   Everything below this line belongs to THIS prototype, not to the
   RMX foundation above. It covers three things the design system does
   not define as components:

     1. The Orion Assistant panel (chat, prompt library, history).
        Orion's own surfaces — RMX Components carries Orion Action Bar,
        Chat Bubble, Tag and Overlay, but not an assembled panel.
     2. The printed report and its viewer, styled per the Rent Manager
        Reports Guide. A report is a document, not an Express surface,
        so it keeps the report engine's own type and colour.
     3. The print dialog, deliberately imitating OS chrome.

   Colour, spacing and radius resolve to RMX Foundations tokens wherever
   a token exists. Where one does not, the value is a literal with the
   reason stated inline, and it is logged in PROTOTYPE.md.
   ============================================================ */

:root {
  /* Primary-button hover. DESIGN.md §7.1 specifies #0071AA but RMX
     Foundations ships no token for it and rmx.css defines no primary
     hover at all — logged in PROTOTYPE.md as a system gap. */
  --proto-brand-hover: #0071aa;

  /* Shadows. DESIGN.md §4 gives the measured values; tokens.css carries
     only the Orion glows, so the rest live here. */
  --shadow-sm: 2px 2px 12px -5px rgba(76,76,76,.08), 0 4px 15px -5px rgba(76,76,76,.08);
  --shadow-md: 0 0 2.5px rgba(76,76,76,.05), 0 -2px 10px rgba(76,76,76,.06), 0 10px 5px rgba(76,76,76,.15), 1px 2px 6px rgba(76,76,76,.14);
  --shadow-lg: 1px 2px 12px 1px rgba(76,76,76,.14), 0 10px 10px -5px rgba(76,76,76,.15);
  --shadow-toast: 0 3px 6px rgba(0,0,0,.25);
  --shadow-orion: var(--orion-glow);
  --shadow-tile: 0 0 5px rgba(76,76,76,.05), 0 -2px 20px rgba(76,76,76,.06), 0 10px 10px -5px rgba(76,76,76,.15), 1px 2px 12px 1px rgba(76,76,76,.14);

/* 1. Blue action text and links carry NO underline in RMX, in either
      state. rmx.css underlines .rmx-btn--text and .rmx-btn--underline
      labels on hover and .rmx-text--link on hover; browsers underline
      bare <a> by default and nothing resets it. */
a,
.rmx-text--link,
.rmx-text--link:hover,
.rmx-btn--text:hover .rmx-btn__label,
.rmx-btn--underline .rmx-btn__label { text-decoration: none; }

/* 2. An unchecked .rmx-check renders a gray tick — rmx.css colours the
      glyph white when checked but never hides it when not. */
.rmx-check:not([data-checked="true"]) .rmx-check__box > svg { visibility: hidden; }
