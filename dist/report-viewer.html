/* tokens.css */
/* ============================================================
   RMX Foundations tokens — GENERATED SHAPE, PARTIALLY VERIFIED
   ------------------------------------------------------------
   Naming rule (reproducible by scripts/sync.md):
     Figma variable path -> lowercase -> "/" becomes "-"
     -> drop a parent segment whose word already appears in the leaf
     -> collapse an immediately repeated word.
     Background/Button/primary-button  ->  --background-primary-button
     Text/text-primary                 ->  --text-primary
     Container/tertiary-dark           ->  --container-tertiary-dark

   Provenance:
     [M] measured off the live component library, 27 Aug 2026
     [N] name confirmed in RMX Foundations, VALUE NOT YET VERIFIED
         (carried from the v1 stylesheet — replace from the plugin export)

   Values marked [N] are the reason scripts/sync.md exists. Do not treat
   them as authoritative.
   ============================================================ */

:root {

  --spacing-xs:   8px;    /* [M] */
  --spacing-sm:  12px;    /* [M] */
  --spacing-md:  16px;    /* [M] */

  /* 4xl–9xl exist in Foundations; add them from the export. */

/* rmx.css */
/* ============================================================
   RMX recipes — consumes assets/tokens.css. NO literal colours here.
   Every class is namespaced rmx- so scripts/audit.mjs can find them
   and so prototypes never collide with page styles.

   Pair with:
   <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

   Icons: RMX uses a Flexible Icon component, not raw Material glyphs.
   In HTML, use inline <svg> — see references/controls.md. Do NOT load
   an icon font by ligature; it degrades to visible words offline.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

body.rmx {
  margin: 0;
  font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px; line-height: 20px;
  color: var(--text-primary);
  background: var(--background-ui-primary);
}

/* ---------- Typography (Text Placeholder equivalents) ---------- */
.rmx-text            { font-size: 14px; line-height: 20px; color: var(--text-primary); }
.rmx-text--semibold  { font-weight: 600; color: var(--text-secondary); }
.rmx-text--link      { color: var(--text-link); cursor: pointer; }
.rmx-text--link:hover{ text-decoration: underline; }
.rmx-text--label     { color: var(--text-primary); }
/* Text Style=Italic Disabled — the ONLY use of italic gray */
.rmx-placeholder     { font-style: italic; color: var(--text-disabled); }
.rmx-h1 { font: 400 24px/32px Roboto, sans-serif; color: var(--text-secondary); margin: 0; }
.rmx-h2 { font: 400 20px/28px Roboto, sans-serif; color: var(--text-secondary); margin: 0; }
.rmx-h3 { font: 600 16px/24px Roboto, sans-serif; color: var(--text-secondary); margin: 0; }

/* ---------- Button ---------- */
.rmx-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--spacing-xxs);
  height: 36px; padding: var(--spacing-xs) var(--spacing-md);
  border: 1px solid transparent; border-radius: var(--radius-sm);
  font: var(--type-label-m-regular);   /* Web/Label/M/Regular - 14/400, NOT 500 */ cursor: pointer; white-space: nowrap;
}
.rmx-btn--primary   { background: var(--background-primary-button); color: var(--text-inverse); }
.rmx-btn--secondary { background: var(--background-secondary-button); color: var(--text-link);
                      border-color: var(--border-secondary); }
.rmx-btn--secondary:hover { background: var(--border-disabled); }
.rmx-btn--text      { background: transparent; color: var(--text-link); padding: 0 var(--spacing-xs); }
.rmx-btn--marketing { background: var(--background-tertiary-button); color: var(--text-secondary);
                      width: 296px; height: 48px; font-size: 16px; }
.rmx-btn--compact   { height: 24px; padding: 0 var(--spacing-xs); }
.rmx-btn:disabled   { background: var(--background-brand-primary-disabled); cursor: default; }

/* Split Button — two segments, 1px inverse divider, trailing caret segment.
   v1 declared this component and never implemented it. */
.rmx-split { display: inline-flex; height: 36px; border-radius: var(--radius-sm); overflow: hidden; }
.rmx-split > .rmx-split__main {
  display: inline-flex; align-items: center; gap: var(--spacing-xxs);
  padding: 0 var(--spacing-md); background: var(--background-primary-button);
  color: var(--text-inverse); font: var(--type-label-m-regular);   /* Web/Label/M/Regular - 14/400, NOT 500 */ border: 0; cursor: pointer;
}
.rmx-split > .rmx-split__caret {
  width: 24px; display: inline-flex; align-items: center; justify-content: center;
  background: var(--background-primary-button); color: var(--text-inverse);
  border: 0; border-left: 1px solid var(--container-primary); cursor: pointer;
}

/* ---------- Input Field (static-prototype safe: works on a div) ---------- */
.rmx-field { display: flex; flex-direction: column; gap: var(--spacing-xxs); width: 248px; }
.rmx-field > .rmx-field__label { font-size: 14px; color: var(--text-primary); }
.rmx-field--filter > .rmx-field__label { color: var(--text-label); }
.rmx-field__box {
  display: flex; align-items: center; gap: var(--spacing-xs);
  height: 36px; padding: var(--spacing-xs);
  background: var(--component-input-default);
  border: 1px solid var(--border-primary); border-radius: var(--radius-sm);
  color: var(--text-secondary); font-size: 14px;
}
.rmx-field__box:focus-within { border-color: var(--border-secondary); }
.rmx-field__box > input { all: unset; flex: 1; min-width: 0; color: inherit; font: inherit; }
.rmx-field__box > input::placeholder { font-style: italic; color: var(--text-disabled); }

/* ---------- Checkbox / Radio ---------- */
.rmx-check { display: inline-flex; align-items: center; gap: var(--spacing-xs); cursor: pointer; }
.rmx-check__box {
  width: 20px; height: 20px; flex: none; border-radius: 2px;
  border: 2px solid var(--icon-disabled); background: var(--container-primary);
  display: inline-flex; align-items: center; justify-content: center;
}
/* Checked is ORANGE — icon-attention #F58220. v1's stylesheet used the
   marketing orange #F79B4D, which is a different token. */
.rmx-check[data-checked="true"] .rmx-check__box {
  background: var(--icon-attention); border-color: var(--border-attention);
}
.rmx-check[data-checked="true"] .rmx-check__box > svg { color: var(--container-primary); }
/* State=Blue / State=Register — the select-all above a register */
.rmx-check--blue[data-checked="true"] .rmx-check__box,
.rmx-check--register[data-checked="true"] .rmx-check__box {
  background: var(--border-secondary); border-color: var(--border-secondary);
}
.rmx-radio__dot {
  width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--icon-disabled);
  display: inline-flex; align-items: center; justify-content: center;
}
.rmx-radio[data-checked="true"] .rmx-radio__dot { border-color: var(--border-secondary); }
.rmx-radio[data-checked="true"] .rmx-radio__dot::after {
  content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--border-secondary);
}

/* ---------- Tabs — ONE definition. Active underline is BLUE. ---------- */
.rmx-tab {
  padding: var(--spacing-md) var(--spacing-xs);
  font: 600 14px/1 Roboto, sans-serif; color: var(--text-primary);
  background: transparent;                      /* never a fill */
  border: 0; border-bottom: 2px solid transparent;
  cursor: pointer;
}
.rmx-tab[aria-selected="true"] {
  color: var(--text-secondary);
  border-bottom-color: var(--border-secondary);  /* #008DD5, 2px */
  background: transparent;
}
.rmx-tabrow { display: flex; align-items: flex-start; }

/* ---------- Lozenge / Pill ---------- */
.rmx-lozenge {
  display: inline-flex; align-items: center; gap: var(--spacing-xs);
  height: 24px; padding: var(--spacing-xxs) var(--spacing-xs);
  border-radius: var(--radius-sm); font-size: 14px; color: var(--text-secondary);
}
.rmx-lozenge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
.rmx-lozenge--success { background: var(--component-lozenge-success); }
.rmx-lozenge--success::before { background: var(--icon-success); }
.rmx-lozenge--error   { background: var(--component-lozenge-error); }
.rmx-lozenge--error::before { background: var(--icon-error); }
.rmx-lozenge--brand   { background: var(--component-lozenge-brand); }
.rmx-lozenge--brand::before { background: var(--icon-brand); }
.rmx-lozenge--caution { background: var(--component-lozenge-caution); }
.rmx-lozenge--caution::before { background: var(--icon-notice); }
.rmx-lozenge--status  { background: transparent; font-style: italic; padding: 0; }
.rmx-lozenge--status::before { display: none; }
.rmx-lozenge--32 { height: 32px; }
.rmx-pill {
  display: inline-flex; align-items: center; gap: var(--spacing-xxs);
  height: 20px; padding: 0 var(--spacing-xs);
  border-radius: var(--radius-lg);                /* Radius/lg — legitimately round */
  background: var(--container-primary); border: 1px solid var(--border-secondary);
  font-size: 14px; color: var(--text-secondary);
}

/* ---------- Register: Header + Cell + Cell Content ---------- */
.rmx-register { width: 100%; border-collapse: collapse; background: var(--container-primary); }
/* Header Style=Register — full-page, gray */
.rmx-register th { font: var(--type-label-s-medium); letter-spacing: 1.134px;
  height: 28px; padding: var(--spacing-xxs) var(--spacing-xs);
  background: var(--container-tertiary-dark); color: var(--text-inverse);
  font: 500 12.6px/1 Roboto, sans-serif; letter-spacing: 1.1px; text-align: left;
  border-right: .5px solid var(--container-primary); white-space: nowrap;
}
.rmx-register th:last-child { border-right: 0; }
/* Header Style=Table — embedded in a Tile, white */
.rmx-register--table th {
  height: 32px; background: var(--container-primary); color: var(--text-secondary);
  border-top: 1px solid var(--border-primary); border-bottom: 1px solid var(--border-primary);
  border-right: 0;
}
/* Cell */
.rmx-register td {
  height: var(--cell-height); padding: 0 var(--spacing-xs);
  background: var(--component-register-row-default); color: var(--text-secondary);
  border-top: 1px solid var(--border-disabled); border-bottom: 1px solid var(--border-disabled);
  font-size: 14px;
}
.rmx-register tr[data-striped="true"] td { background: var(--container-tertiary); }
.rmx-register__totals { padding-top: var(--spacing-xs); text-align: right; font-size: 12px; color: var(--text-disabled); }
.rmx-colorblock { display: block; width: 10px; height: var(--cell-height); }

/* ---------- Tile ---------- */
.rmx-tile {
  display: flex; flex-direction: column;
  background: var(--background-tile);
  border: 1px solid var(--border-primary); border-radius: var(--radius-sm);
}
.rmx-tile__header {
  display: flex; align-items: center; gap: var(--spacing-xs);
  min-height: 36px; padding: var(--spacing-xs);
  border-bottom: 2px solid var(--border-secondary);
}
.rmx-tile__title { font: 600 14px/1 Roboto, sans-serif; color: var(--text-secondary); }
.rmx-tile__actions { margin-left: auto; display: flex; align-items: center; gap: var(--spacing-xs); }
.rmx-tile__body { padding: var(--spacing-md); display: flex; flex-direction: column; gap: var(--spacing-md); flex: 1; }
.rmx-fieldgrid { display: flex; gap: var(--spacing-xl); }
.rmx-fieldgrid__col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--spacing-md); }
.rmx-ro { display: flex; flex-direction: column; }
.rmx-ro__label { font-size: 14px; color: var(--text-primary); }
.rmx-ro__value { font: 600 14px/20px Roboto, sans-serif; color: var(--text-secondary); }
.rmx-ro__value--link { color: var(--text-link); }

/* ---------- Scoreboard Header ---------- */
.rmx-scoreboard {
  display: flex; min-height: 64px;
  background: var(--container-primary);
  border: 1px solid var(--border-primary); border-radius: var(--radius-sm); overflow: hidden;
}
.rmx-scoreboard__bar { width: 16px; flex: none; background: var(--container-secondary-dark); }
.rmx-scoreboard__content {
  flex: 1; display: flex; align-items: center; gap: var(--spacing-2xl);
  padding: 0 var(--spacing-md);
}

/* ---------- Page chrome ---------- */
/* ---------- App bar (Header, Use=Default) ----------
   Harvested from RMX Components node 18:2314. Do not restyle, do not rebuild.

   The structure is the part that kept going wrong: it is THREE EQUAL COLUMNS
   (flex:1 0 0 each), not a row with margin-left:auto. The search bar lands
   centred because its column is centred — reproduce it any other way and the
   bar is subtly wrong on every screen.

   The icon cluster belongs INSIDE the Command Launch column, left of the
   search field. It is a segmented control on --component-command-launch with
   1px gaps, rounded only on the outer ends — not three outlined buttons. */
.rmx-appbar {
  display: flex; align-items: center; overflow: clip;
  height: 48px;
  /* --display-display (1920) is the Figma CANVAS width, not a CSS rule. Pinning
     the bar to it made every screen scroll horizontally below 1920, including
     at 1440. The bar is full-bleed and fluid; 1920 is the width it was
     MEASURED at, and the three columns keep their proportions at any width. */
  width: 100%; min-width: 960px;
  padding: var(--spacing-xs) var(--spacing-md);
  background: var(--component-main-header); color: var(--text-ondark);
}
.rmx-appbar__leading,
.rmx-appbar__launch,
.rmx-appbar__manage { flex: 1 0 0; min-width: 1px; display: flex; align-items: center; }
.rmx-appbar__leading { gap: var(--spacing-md); }
.rmx-appbar__launch  { gap: var(--spacing-xs); justify-content: center; }
.rmx-appbar__manage  { gap: var(--spacing-2xl); justify-content: flex-end; padding-block: 1px; }

/* The real Rent Manager logo, node 9671:2926 — 175x32, currentColor so it
   takes --text-ondark. Never set the brand as a text span. */
.rmx-appbar__logo { width: 175px; height: 32px; flex: none; fill: currentColor; }
.rmx-appbar__logo--mark { display: none; }

.rmx-appbar__icons { display: flex; align-items: center; gap: 1px; }
.rmx-appbar__icons > button {
  height: 32px; border: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: var(--component-command-launch); color: var(--text-ondark);
}
.rmx-appbar__icons > button:first-child {
  width: 39.02px;
  border-radius: var(--radius-sm) 0 0 var(--radius-sm);
}
.rmx-appbar__icons > button:nth-child(2) { width: 45.03px; padding: 6px 13px; }
.rmx-appbar__icons > button:last-child {
  width: 38.02px; padding: 6px 9px;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

/* Command Launch search — 454px, and its placeholder is Web/Label/S/Italic
   (12px italic, text-ondark), not the 14px regular of a normal Input Field. */
.rmx-appbar__search {
  display: flex; align-items: center; gap: var(--spacing-xs);
  /* 454px is its measured width at 1920. It may shrink below that rather than
     force the bar to overflow; it never grows past it. */
  width: 454px; max-width: 100%; min-width: 0; flex: 0 1 454px;
  height: 32px; overflow: clip;
  padding: 14px var(--spacing-xs);
  border-radius: var(--radius-sm);
  background: var(--component-command-launch);
}
.rmx-appbar__search > .rmx-icon { width: 24px; height: 24px; flex: none; }
.rmx-appbar__search > input {
  all: unset; flex: 1; min-width: 0;
  font: var(--type-label-s-italic); color: var(--text-ondark);
}
.rmx-appbar__search > input::placeholder { color: var(--text-ondark); opacity: 1; }

.rmx-appbar__code { display: flex; flex-direction: column; color: var(--text-ondark); }
.rmx-appbar__code > :first-child { font: var(--type-label-s-regular); }
.rmx-appbar__code > :last-child  { font: var(--type-label-m-regular); }

.rmx-appbar__user { display: flex; align-items: center; justify-content: flex-end; gap: var(--spacing-lg); }
.rmx-appbar__avatar {
  width: 32px; height: 32px; border-radius: var(--radius-round);
  display: flex; align-items: center; justify-content: center;
  background: var(--container-secondary); color: var(--text-inverse, #fff);
  font: var(--type-label-m-regular);
}
/* ---------- Context Bar ----------
   Harvested from node 10861:12222. Two slots, justify-between: leading items
   left, trailing items right. Both slots gap 12px (--spacing-sm), NOT 16.
   The page title is Web/Heading/S/Regular (18/24) in --text-inverse; trailing
   items are 20px icons. */
.rmx-contextbar {
  display: flex; align-items: center; justify-content: space-between;
  height: 40px; width: 100%; min-width: 960px; overflow: clip;
  padding: var(--spacing-xs) var(--content-contentpadding);
  background: var(--component-context-header); color: var(--text-inverse);
}
.rmx-contextbar__leading,
.rmx-contextbar__trailing { display: flex; align-items: center; gap: var(--spacing-sm); overflow: clip; }
.rmx-contextbar__trailing { justify-content: flex-end; }
.rmx-contextbar__trailing .rmx-icon { width: 20px; height: 20px; }
.rmx-contextbar__title { font: var(--type-heading-s-regular); color: var(--text-inverse); }
/* A white field inside the blue bar must not inherit white text.
   This is the cascade bug that made v1's entity field invisible. */
.rmx-contextbar .rmx-field__box,
.rmx-contextbar .rmx-field__box > input { color: var(--text-secondary); }
.rmx-actionbar {
  width: 40px; flex: none; display: flex; flex-direction: column; align-items: center;
  gap: var(--spacing-md); padding: var(--spacing-md) var(--spacing-xs);
  background: var(--container-secondary-dark); color: var(--text-ondark);
}
.rmx-shell { display: flex; align-items: stretch; min-height: calc(100vh - 88px); }
.rmx-page { max-width: 100%; flex: 1; min-width: 0; padding: var(--spacing-md) var(--spacing-xl); background: var(--container-primary); }
.rmx-filterrow { display: flex; align-items: flex-end; gap: var(--spacing-xs); padding-bottom: var(--spacing-sm); }
.rmx-filterrow__actions { margin-left: auto; display: flex; gap: var(--spacing-xs); }

/* ---------- Feedback: three DIFFERENT components ---------- */
/* Callout — always outlined, 40px. Type = Default | Help | Error | Warning */
.rmx-callout {
  display: flex; align-items: center; gap: var(--spacing-xs);
  min-height: 40px; padding: var(--spacing-xs); border-radius: var(--radius-sm);
  background: var(--container-primary); border: 1px solid var(--border-secondary);
  font: 600 14px/20px Roboto, sans-serif; color: var(--text-secondary);
}
.rmx-callout--warning { border-color: var(--border-attention); }
.rmx-callout--error   { border-color: var(--text-error); }
/* Bulk Action — the FILLED banner above a register. Blue, not navy. */
.rmx-bulkaction {
  display: flex; align-items: center; gap: var(--spacing-xs);
  height: 48px; padding: 0 var(--spacing-md); border-radius: var(--radius-sm);
  background: var(--component-toast-brand); color: var(--text-inverse);
}
/* Toast — State = Success | Action | Failure. Action (blue) is the default. */
.rmx-toast {
  display: flex; align-items: center; gap: var(--spacing-xs);
  padding: var(--spacing-md); border-radius: var(--radius-sm);
  background: var(--component-toast-brand); color: var(--text-inverse);
  font: 600 16px/24px Roboto, sans-serif;
  box-shadow: 0 3px 6px rgba(0,0,0,.25);
}
.rmx-toast--success { background: var(--component-toast-success); }
.rmx-toast--failure { background: var(--text-error); }
/* Reminder — the green surface belongs here, not to Toast. */
.rmx-reminder {
  display: flex; gap: var(--spacing-md); width: 376px; padding: var(--spacing-md);
  border-radius: var(--radius-sm); background: var(--component-toast-success); color: var(--text-inverse);
}

/* ---------- Overlays ---------- */
.rmx-overlay { background: var(--background-card); border: 1px solid var(--border-primary);
               border-radius: var(--radius-sm); overflow: hidden; }
.rmx-overlay__header { display: flex; align-items: center; height: 48px; padding: 0 var(--spacing-md);
  background: var(--container-primary); border-bottom: 1px solid var(--border-primary);
  font: 400 16px/24px Roboto, sans-serif; color: var(--text-secondary); }
.rmx-overlay__footer { display: flex; align-items: center; justify-content: flex-end; gap: var(--spacing-xs);
  height: 52px; padding: 0 var(--spacing-md);
  background: var(--background-footer); border-top: 1px solid var(--border-primary); }

/* ---------- Board card + swim lane ---------- */
.rmx-boardcard {
  width: 272px; min-height: 128px; display: flex;
  background: var(--container-primary); border-radius: var(--radius-sm);
  box-shadow: 0 0 2.5px rgba(76,76,76,.05), 0 -2px 10px rgba(76,76,76,.06), 0 10px 5px rgba(76,76,76,.15);
}
.rmx-boardcard__bar { width: 8px; flex: none; border-radius: var(--radius-sm) 0 0 var(--radius-sm); }

/* ---------- Orion — the gradient is a BORDER, not a fill ---------- */
.rmx-orion-surface {
  background: var(--container-primary);
  border-radius: var(--orion-radius-overlay);
  box-shadow: var(--orion-glow-lg);
  border: 1px solid transparent;
  background-image: linear-gradient(var(--container-primary), var(--container-primary)), var(--orion-border-gradient);
  background-origin: border-box;
  background-clip: padding-box, border-box;
}
.rmx-orion-bar {
  min-height: 52px; border-radius: var(--orion-radius-bar);
  box-shadow: var(--orion-glow);
  border: 1px solid transparent;
  background-image: linear-gradient(var(--background-ui-primary), var(--background-ui-primary)), var(--orion-border-gradient);
  background-origin: border-box; background-clip: padding-box, border-box;
}
.rmx-orion-tag {
  display: inline-flex; align-items: center; gap: var(--spacing-xxs);
  height: 20px; padding: 0 var(--spacing-xs); border-radius: var(--radius-sm);
  background: var(--container-primary); font-size: 12px; color: var(--text-secondary);
  border: 1px solid transparent;
  background-image: linear-gradient(var(--container-primary), var(--container-primary)), var(--orion-border-gradient);
  background-origin: border-box; background-clip: padding-box, border-box;
}

/* Icons: sized boxes for inline SVG. */
/* The harvested icons are FILL-based (the library exports filled paths, not
   strokes). Without fill:currentColor they render solid black — invisible on
   the navy app bar, muddy everywhere else. */
.rmx-icon { width: 20px; height: 20px; flex: none; display: inline-block; fill: currentColor; }
.rmx-icon--16 { width: 16px; height: 16px; }
.rmx-icon--24 { width: 24px; height: 24px; }

/* ---------- Action button underline ----------
   The underlined state belongs to the LABEL, never to an icon sitting next to
   it. text-decoration inherits into inline SVG children and draws a stray rule
   under the glyph, which reads as a rendering bug. */
.rmx-btn__label { text-decoration: inherit; }
.rmx-btn--text:hover .rmx-btn__label,
.rmx-btn--underline .rmx-btn__label { text-decoration: underline; }
.rmx-btn--text:hover,
.rmx-btn--underline { text-decoration: none; }
.rmx-btn .rmx-icon,
.rmx-text--link .rmx-icon { text-decoration: none; }

/* proto.css */
/* RMX prototype-only styles — the same file in every prototype.

   Everything here is scaffolding that a real Express screen would not need:
   the scrim behind an overlay, the toast stack, the dropdown panel, the
   screen index. It is separate from rmx.css so it stays obvious what is the
   design system and what is prototype plumbing — a developer handed this
   deletes proto.css and keeps rmx.css.

   Tokens only. No hex values. */

/* ---- overlays ---- */
.rmx-scrim {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .32);
  z-index: 900;
}

.rmx-overlay.is-open,
[data-rmx-panel].is-open {
  position: fixed;
  z-index: 950;
}

.rmx-overlay.is-open {
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-height: calc(100vh - 96px);
  overflow: auto;
}

/* A side panel slides from the right rather than sitting centred. */
[data-rmx-panel].is-open {
  top: 0;
  right: 0;
  bottom: 0;
  width: 480px;
  background: var(--background-primary, #fff);
  border-left: 1px solid var(--border-primary);
  display: flex;
  flex-direction: column;
  overflow: auto;
}

/* ---- dropdown panel ----
   The floating half of a dropdown. The trigger is an Input Field, styled by
   rmx.css. Never a native <select>. */
[data-rmx-dropdown] {
  position: relative;
}

.rmx-menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  min-width: 100%;
  z-index: 800;
  background: var(--background-primary, #fff);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm, 4px);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
  padding: var(--spacing-xxs, 4px) 0;
  max-height: 320px;
  overflow: auto;
}

.rmx-menu > [data-value] {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  font: inherit;
  color: var(--text-primary);
  padding: 0 var(--spacing-sm, 12px);
  height: 32px;
  line-height: 32px;
  cursor: pointer;
}

.rmx-menu > [data-value]:hover {
  background: var(--background-ui-primary);
}

.rmx-menu > [data-value][aria-selected="true"] {
  font-weight: 500;
  color: var(--text-link);
}

[data-rmx-dropdown][data-open="true"] [data-rmx-trigger] .rmx-icon {
  transform: rotate(180deg);
}

/* ---- toasts ---- */
.rmx-toaststack {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-xs, 8px);
  align-items: center;
  pointer-events: none;
}

/* ---- sortable register headers ---- */
.rmx-register th[data-sort] {
  cursor: pointer;
  user-select: none;
}

.rmx-register th[data-dir]::after {
  content: "";
  display: inline-block;
  margin-left: var(--spacing-xxs, 4px);
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
}

.rmx-register th[data-dir="asc"]::after  { border-bottom: 4px solid currentColor; }
.rmx-register th[data-dir="desc"]::after { border-top: 4px solid currentColor; }

/* ---- screen index (index.html only) ---- */
.rmx-index {
  padding: 32px;
  max-width: 860px;
}

.rmx-index__list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-xs, 8px);
}

.rmx-index__item {
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm, 4px);
  background: var(--background-primary, #fff);
  padding: 12px var(--spacing-md, 16px);
}

.rmx-index__note {
  color: var(--text-tertiary);
  margin: var(--spacing-xxs, 4px) 0 0;
}

/* ---- utilities ---- */
[hidden] { display: none !important; }

.rmx-icon { transition: transform .12s ease; }

:focus-visible {
  outline: 2px solid var(--border-secondary);
  outline-offset: 1px;
}

/* responsive.css */
/* ============================================================
   RMX responsive — PROTOTYPE CONVENTIONS, NOT LIBRARY TRUTH
   ------------------------------------------------------------
   RMX Foundations defines exactly ONE width: --display-display,
   1920px. There are no breakpoint tokens and no Mobile / Tablet /
   Narrow variants on any of the 130 components. Everything in the
   library is authored at 1920.

   So every rule in this file is a decision taken for prototypes,
   agreed with Emma on 2026-09-10 — not a value harvested from
   Figma. If the design system later defines responsive behaviour,
   THAT wins and this file is replaced.

   Read references/responsive.md before changing anything here.

   Breakpoints (named after what they are for, not after devices):
     >= 1280   desktop   as authored; nothing collapses
     1024-1279 laptop    fluid, search shrinks, nothing hides
      768-1023 tablet    secondary chrome hides, page padding drops
      < 768    phone     single column, app bar reduced to essentials
   ============================================================ */

:root {
  --bp-laptop: 1280px;
  --bp-tablet: 1024px;
  --bp-phone: 768px;
}

/* The bars are full-bleed and fluid at every width. 1920 is what they
   were measured at, never a floor. */
.rmx-appbar,
.rmx-contextbar { min-width: 0; }

/* ---------- 1024–1279 · laptop ----------
   Nothing hides. The Command Launch search gives up width first, because
   it is the only element in the bar with slack. */
@media (max-width: 1279px) {
  .rmx-appbar__search { flex: 0 1 380px; }
}

/* ---------- 768–1023 · tablet ----------
   DECISION: Company Code is the first thing to go. It is reference
   information, not navigation, and it is the widest low-value block in
   the Manage column. The avatar and bell stay — they are wayfinding. */
@media (max-width: 1023px) {
  .rmx-appbar__code { display: none; }
  .rmx-appbar__search { flex: 0 1 280px; }
  .rmx-appbar__manage { gap: var(--spacing-md); }
  .rmx-page { padding-inline: var(--spacing-md); }
  .rmx-shell { display: block; }

  /* DECISION: the 40px Action Bar rail becomes a horizontal strip under
     the context bar rather than a side rail, which would eat a fifth of
     a tablet's width. */
  .rmx-actionbar {
    width: 100%; flex-direction: row; justify-content: flex-end;
    padding: var(--spacing-xs) var(--spacing-md);
    border-bottom: 1px solid var(--border-primary);
  }

  /* Tiles stop sitting side by side. */
  .rmx-tilerow, .rmx-fieldgrid { flex-direction: column; }
  .rmx-fieldgrid__col { width: 100%; }
}

/* ---------- < 768 · phone ----------
   DECISION: the app bar keeps logo, search and avatar. The icon cluster
   (Mega Menu / Reports / Favorites) hides — all three are shortcuts that
   also exist elsewhere, and at this width the search is what people use.
   The three columns stop being equal thirds, because equal thirds at
   375px leaves the search unusable. */
@media (max-width: 767px) {
  .rmx-appbar { padding-inline: var(--spacing-sm); gap: var(--spacing-xs); }
  .rmx-appbar__icons { display: none; }
  .rmx-appbar__leading { flex: 0 0 auto; }
  .rmx-appbar__launch { flex: 1 1 auto; }
  .rmx-appbar__manage { flex: 0 0 auto; }
  /* Swap the full lockup for the roof mark. Scaling the 175px lockup down to
     32 makes an illegible smudge; the mark is the same artwork, cropped. */
  .rmx-appbar__logo { display: none; }
  .rmx-appbar__logo--mark[hidden] { display: block !important; width: 32px; }
  .rmx-appbar__search { flex: 1 1 auto; min-width: 0; }

  .rmx-contextbar { padding-inline: var(--spacing-sm); }
  .rmx-page { padding-inline: var(--spacing-sm); }

  /* A dialog at 520px does not fit 375. Overlays go near-full-bleed. */
  .rmx-overlay.is-open {
    width: calc(100vw - 24px) !important;
    max-width: calc(100vw - 24px);
    max-height: calc(100vh - 48px);
  }
  [data-rmx-panel].is-open { width: 100%; }

  /* Filter rows wrap instead of overflowing. */
  .rmx-filterrow { flex-wrap: wrap; }
  .rmx-field { width: 100%; }
}

/* ---------- Registers ----------
   DECISION (Emma, 2026-09-10): columns shrink until they cannot, then
   truncate with an ellipsis. The register does NOT get its own sideways
   scroll, and no column is hidden — hiding one would need a priority
   order per screen, which is a per-design decision, not a global rule.

   Cells keep their 36px height and 14px type at every width: those are
   system rules and do not flex. */
.rmx-register { table-layout: auto; }
.rmx-register th,
.rmx-register td {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* A truncated cell must still be readable on hover/focus for a prototype
   to be testable — this reveals the full value without changing layout. */
.rmx-register td[title]:hover { cursor: help; }

@media (max-width: 1023px) {
  .rmx-register th,
  .rmx-register td { max-width: 180px; }
}
@media (max-width: 767px) {
  .rmx-register th,
  .rmx-register td { max-width: 120px; padding-inline: var(--spacing-xs); }
}

/* Anything genuinely un-shrinkable scrolls inside its own box rather than
   pushing the page sideways. */
.rmx-tile__body { max-width: 100%; overflow-x: auto; }

/* orion.css */
/* ============================================================
   Orion Assistant — this prototype's own stylesheet
   ------------------------------------------------------------
   Loaded AFTER proto.css, and deliberately not part of it: check.mjs owns
   the seven foundation files (tokens, type, rmx, proto, responsive, app.js,
   icons.svg) and refreshes any that drift from the skill, so anything
   written into proto.css is lost on the next check. Prototype-specific
   styling belongs here instead.
   ============================================================ */

/* ============================================================
   Sections
   ------------------------------------------------------------
   Everything below this line belongs to THIS prototype, not to the
   RMX foundation above. It covers three things the design system does
   not define as components:

     1. The Orion Assistant panel (chat, prompt library, history).
        Orion's own surfaces — RMX Components carries Orion Action Bar,
        Chat Bubble, Tag and Overlay, but not an assembled panel.
     2. The printed report and its viewer, styled per the Rent Manager
        Reports Guide. A report is a document, not an Express surface,
        so it keeps the report engine's own type and colour.
     3. The print dialog, deliberately imitating OS chrome.

   Colour, spacing and radius resolve to RMX Foundations tokens wherever
   a token exists. Where one does not, the value is a literal with the
   reason stated inline, and it is logged in PROTOTYPE.md.
   ============================================================ */

:root {
  /* Primary-button hover. DESIGN.md §7.1 specifies #0071AA but RMX
     Foundations ships no token for it and rmx.css defines no primary
     hover at all — logged in PROTOTYPE.md as a system gap. */
  --proto-brand-hover: #0071aa;

  /* Shadows. DESIGN.md §4 gives the measured values; tokens.css carries
     only the Orion glows, so the rest live here. */
  --shadow-sm: 2px 2px 12px -5px rgba(76,76,76,.08), 0 4px 15px -5px rgba(76,76,76,.08);
  --shadow-md: 0 0 2.5px rgba(76,76,76,.05), 0 -2px 10px rgba(76,76,76,.06), 0 10px 5px rgba(76,76,76,.15), 1px 2px 6px rgba(76,76,76,.14);
  --shadow-lg: 1px 2px 12px 1px rgba(76,76,76,.14), 0 10px 10px -5px rgba(76,76,76,.15);
  --shadow-toast: 0 3px 6px rgba(0,0,0,.25);
  --shadow-orion: var(--orion-glow);
  --shadow-tile: 0 0 5px rgba(76,76,76,.05), 0 -2px 20px rgba(76,76,76,.06), 0 10px 10px -5px rgba(76,76,76,.15), 1px 2px 12px 1px rgba(76,76,76,.14);

  /* The hover tint. rmx.css itself reuses --border-disabled (#EBF1F5)
     for this, so the prototype follows that convention. */
  --bg-hover: var(--border-disabled);
  --rmx-blue-hover: var(--proto-brand-hover);

  /* Report-viewer chrome. Not Express surfaces — a document reader
     imitating the one Express embeds. Kept as literals on purpose. */
  --pdf-toolbar: #f7f9fb;
  --pdf-gutter:  #e9edf2;
  --pdf-chip:    #eef3f8;

  --radius-md: 8px;   /* DESIGN.md §4 "md 8 (larger surfaces)" */
  --radius-xs: 2px;   /* DESIGN.md §4 "xs 2 (checkbox boxes)" */
}

/* ---- Corrections to the shipped foundation ----------------------
   Two rmx.css 4.0.0 behaviours this prototype overrides. Both are
   written up in PROTOTYPE.md under "Worth raising". */

/* 1. Blue action text and links carry NO underline in RMX, in either
      state. rmx.css underlines .rmx-btn--text and .rmx-btn--underline
      labels on hover and .rmx-text--link on hover; browsers underline
      bare <a> by default and nothing resets it. */
a,
.rmx-text--link,
.rmx-text--link:hover,
.rmx-btn--text:hover .rmx-btn__label,
.rmx-btn--underline .rmx-btn__label { text-decoration: none; }

/* 1b. An <a> also takes the browser's default link colour (#0000EE) unless
      something sets one, and neither rmx.css nor proto.css does — only
      .rmx-text--link does, so every bare <a> rendered in UA blue.
      DESIGN.md §2.1: RMX Blue carries all interactivity, links included,
      so that is the default here. */
a { color: var(--text-link); }

/* Inside the two bars a link takes the bar's own colour instead. The app-bar
   logo is fill: currentColor so it can be white on navy — left to the rule
   above it rendered a bright blue wordmark. */
.rmx-appbar a,
.rmx-contextbar a { color: inherit; }

/* 2. An unchecked .rmx-check renders a gray tick — rmx.css colours the
      glyph white when checked but never hides it when not. */
.rmx-check:not([data-checked="true"]) .rmx-check__box > svg { visibility: hidden; }



/* ==== Orion Assistant panel ==== */

/* ============================================================
   Orion Assistant panel
   ============================================================ */
.orion-panel { position: fixed; top: 78px; right: 16px; width: 622px; height: auto; max-height: calc(100vh - 100px);
  /* Orion_2 gradient stroke, blue to green — the AI signature. The fill is
     painted into the padding box and the gradient into the border box, which
     is the only way to give a border a gradient. */
  border: 1px solid transparent; border-radius: var(--radius-md);
  background-image:
    linear-gradient(180deg, rgba(255,255,255,.15) 0%, rgba(0,141,213,.06) 100%),
    linear-gradient(var(--container-primary), var(--container-primary)),
    var(--orion-border-gradient);
  background-origin: padding-box, padding-box, border-box;
  background-clip: padding-box, padding-box, border-box;
  box-shadow: 0 0 12.6px rgba(0,141,213,.2);
  display: flex; z-index: 50; animation: eh-in .18s ease-out; overflow:visible;
  min-width: 380px; min-height: 320px; }
.orion-panel[hidden] { display: none; }
.orion-resize-w { position:absolute; top:12px; bottom:24px; left:-4px; width:8px; cursor:ew-resize; z-index:5; }
.orion-resize-e { position:absolute; top:12px; bottom:24px; right:-4px; width:8px; cursor:ew-resize; z-index:5; }
.orion-resize-h { position:absolute; left:12px; right:24px; bottom:-4px; height:8px; cursor:ns-resize; z-index:5; }
.orion-resize-corner { position:absolute; left:-4px; bottom:-4px; width:16px; height:16px; cursor:nesw-resize; z-index:6; }
.orion-resize-corner::after { content:''; position:absolute; left:5px; bottom:5px; width:7px; height:7px;
  border-left:2px solid var(--border-primary); border-bottom:2px solid var(--border-primary); border-radius:0 0 0 3px; }
.orion-inner { flex:1; min-width:0; min-height:0; background:transparent; border-radius: inherit; overflow:hidden; display:flex; flex-direction:column; position:relative; }

.orion-head { flex:none; display:flex; flex-direction:column; gap:0; padding:10px 16px 0; background:#fff; cursor:move; user-select:none; }
.orion-head .row { display:flex; align-items:center; justify-content:space-between; height:20px; }
.orion-head .left { display:flex; align-items:center; gap:8px; }
.orion-head .left .name { font-size:14px; line-height:20px; font-weight:400; color:var(--text-secondary); }
/* Header icon cluster — Figma "Icons", node 2983:17248. Three 20px glyphs at
   8px gaps, navy (#13314c), with a 1px border-primary separator between each,
   the full 20px height of the icons beside it. */
.orion-head .icons { display:flex; align-items:center; gap:var(--spacing-xs); }
.orion-head .icons .rmx-icon { width:20px; height:20px; color:var(--text-secondary); cursor:pointer; }
.orion-head .icons .rmx-icon:hover { color: var(--text-link); }
.orion-head .vdiv { width:1px; height:20px; background:var(--border-primary); }
.orion-head hr { border:none; border-top:1px solid var(--border-primary); margin:10px -16px 0; }

/* Orion Assistant History — full panel view (Figma node 2431:12173) */
.history-view { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; }
.history-view[hidden] { display:none; }
.history-search-wrap { padding:16px 20px 0; }
.history-search { background:var(--container-tertiary); border:1px solid var(--border-primary); border-radius:var(--radius-sm); height:36px; display:flex; align-items:center; gap:8px; padding:0 8px; }
.history-search .rmx-icon { color:var(--text-disabled); width:20px; height:20px; }
.history-search input { border:none; background:none; outline:none; flex:1; min-width:0; font-size:14px; color:var(--text-secondary); }
.history-search input::placeholder { color:var(--text-primary); font-style:italic; }
.history-section-label { padding:16px 16px 0; font:600 14px/20px 'Roboto',sans-serif; color:var(--text-secondary); }
.history-row { display:flex; align-items:flex-start; gap:8px; padding:20px; cursor:pointer; border:none; background:none; width:100%; text-align:left; font-family:'Roboto',sans-serif; }
.history-row:hover { background:var(--container-tertiary); }
.history-row .htext { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
.history-row .htitle { font:400 14px/20px 'Roboto',sans-serif; color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.history-row .htime { font:400 14px/20px 'Roboto',sans-serif; color:var(--text-primary); }
.history-row .hicons { display:flex; gap:8px; flex:none; padding-top:2px; }
.history-row .hicons .rmx-icon { width:20px; height:20px; cursor:pointer; }
.history-row .star { color:var(--text-disabled); }
.history-row .star.filled { color:var(--background-tertiary-button); }
.history-row .star:hover { color:var(--background-tertiary-button); }
.history-row .trash { color:var(--text-disabled); }
.history-row .trash:hover { color:var(--text-error); }
.history-divider { height:1px; background:var(--border-disabled); margin:0 20px; flex:none; }
.history-empty { padding:20px; font-size:14px; font-style:italic; color:var(--text-disabled); }

.orion-body { flex:1; min-height:0; overflow:auto; padding:20px 20px 16px; display:flex; flex-direction:column; gap:24px; }
.orion-greet { text-align:center; display:flex; flex-direction:column; gap:var(--spacing-xl); }
.orion-greet .hi { font: 600 24px/32px 'Roboto',sans-serif; color: var(--text-secondary); margin:0; }

.home-card { background:#fff; border:1px solid var(--border-primary); border-radius: var(--radius-md); padding:16px; display:flex; flex-direction:column; gap:16px;
  box-shadow: 0px -1px 10px rgba(76,76,76,.02), 0px 4px 7.5px rgba(76,76,76,.08), 2px 2px 6px rgba(76,76,76,.08); }
/* Orion_Input Fields, Style=Square — RMX Components 7086:2817. 36px at rest,
   radius 4, white on a 1px border-primary hairline, 8px gap, placeholder 14
   italic #666666, 20px send icon in brand blue. The Separator in the
   component is set to visible:false, so there is no divider.

   On the padding: Figma draws the 1px stroke INSIDE the 36px frame and
   measures its 8px padding from the frame edge, so the stroke overlaps the
   padding. CSS puts the border outside the padding box, so 8px padding plus
   a 1px border comes to 38. 7px + 1px reproduces both the 8px visual inset
   and the 36px total. */
.home-ask { display:flex; align-items:flex-end; gap:var(--spacing-xs); width:100%;
  background:var(--container-primary); border:1px solid var(--border-primary);
  border-radius: var(--radius-sm); padding:7px; }
.home-ask textarea { flex:1; min-width:0; border:none; outline:none; background:transparent;
  font:400 14px/20px 'Roboto',sans-serif; color:var(--text-secondary);
  resize:none; overflow-y:hidden; display:block; padding:0; margin:0; }
.home-ask textarea::placeholder { color:var(--text-primary); font-style:italic; }
.home-ask .rmx-icon.send { color:var(--text-link); cursor:pointer; flex:none; }
/* Orion Assistant Overlay 2:1069 — inside the ask card, under the field: a
   plain blue text link with a 20px lightbulb and a 4px gap. No border, no
   fill, no padding; 201x20 in the design. (It was briefly a bordered 221x36
   button from Express Help 2993:17318 — the overlay supersedes that.) */
.browse-link { align-self:center; display:inline-flex; align-items:center;
  gap:var(--spacing-xxs); padding:0; cursor:pointer;
  background:none; border:none; color:var(--text-link);
  font:400 14px/20px 'Roboto',sans-serif; }
.browse-link[hidden] { display:none; }
.browse-link:hover .lbl { color:var(--text-link); }
/* 32px between one turn and the next — far enough apart that a question and
   its answer read as one exchange rather than four loose blocks.
   .msg-bot .content keeps its own 10px between a single answer's parts. */
#messagesWrap { display:flex; flex-direction:column; gap:var(--spacing-2xl); }
#messagesWrap:empty { display:none !important; }

.msg-row { display:flex; animation: eh-in .18s ease-out; }
/* Orion Express Help 2695:15935 — the question bubble is square on the bottom
   right only: 8 / 8 / 0 / 8, clockwise from the top left. */
.msg-user { width:100%; background: var(--container-tertiary); border:1px solid var(--border-primary);
  border-radius: var(--radius-md) var(--radius-md) 0 var(--radius-md);
  padding:12px 14px; font-size:14px; line-height:20px; color:var(--text-secondary); }
/* A finished answer carries no Orion mark. The mark is how Orion signals it
   is working — it sits on the thinking indicator while the answer is being
   produced — so repeating it beside every completed message said nothing and
   cost 34px of width on every block. Without it the answer is full width
   naturally, and the negative-margin correction that used to claw that width
   back is gone with it.

   The answer text is navy, the colour for content, rather than the grey used
   for chrome and labels. */
.msg-bot { display:flex; width:100%; }
.msg-bot .content { flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--spacing-lg); }
.msg-bot .text { font-size:14px; line-height:20px; color:var(--text-secondary); }
.rv { opacity:0; transform:translateY(4px); transition:opacity .22s ease, transform .22s ease; }
.rv.rv-in { opacity:1; transform:none; }
/* A real element, not a ::after on .text — the typewriter now runs across
   the whole answer (steps, bullets, rich content, all of it), so the
   cursor has to be able to sit after whichever text node is currently
   filling in, not pinned to the intro line. */
.mtype-cursor { display:inline-block; width:2px; height:14px; margin-left:1px; vertical-align:-2px; background:var(--background-primary-button); animation: eh-blink .8s step-end infinite; }
/* Native scrolling can't push an element past the natural end of content
   — if the freshly-asked question is near the bottom with only a short
   reply below it, there's no scroll room to carry it up to the top of the
   panel. This trailing spacer (height computed in scrollAnchorIntoView)
   manufactures that room so the scroll actually reaches. */
.scroll-spacer { flex:none; }

.mstep { display:flex; gap:10px; align-items:flex-start; }
.mstep .n { width:20px; height:20px; flex:none; border-radius:999px; background:var(--bg-hover); color:var(--text-link); font-size:12px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; margin-top:1px; }
.mstep .t { flex:1; font-size:13.5px; line-height:20px; color:var(--text-secondary); }
.mstep-list, .mbullet-list, .mfind-list { display:flex; flex-direction:column; gap:7px; }
.mbullet { display:flex; gap:10px; } .mbullet .dot { width:5px; height:5px; flex:none; border-radius:999px; background:var(--background-primary-button); margin-top:8px; } .mbullet .t { flex:1; font-size:14px; line-height:20px; color:var(--text-secondary); }
.mfind { display:flex; gap:9px; } .mfind .rmx-icon { width:17px; height:17px; color:var(--text-success); margin-top:2px; } .mfind .t { flex:1; font-size:13.5px; line-height:20px; color:var(--text-secondary); }

/* A fully-formatted answer (multiple sections, numbered steps with their
   own sub-options, a closing note) — the fixed text/steps/bullets/note
   fields can't shape that, so an Express Help answer needing it renders
   through this instead, matching .msg-bot .text's own size/color. */
.mrich { font-size:14px; line-height:20px; color:var(--text-secondary); }
.mrich p { margin:0 0 12px; }
.mrich p:last-child { margin-bottom:0; }
.mrich h4 { font:500 13.5px/20px 'Roboto',sans-serif; color:var(--text-secondary); margin:0 0 6px; }
.mrich ol, .mrich ul { margin:0 0 12px; padding-left:20px; }
.mrich ol:last-child, .mrich ul:last-child { margin-bottom:0; }
.mrich li { margin-bottom:6px; }
.mrich li:last-child { margin-bottom:0; }
.mrich li ul { margin:6px 0 0; padding-left:18px; }
.mrich li ul li:last-child { margin-bottom:0; }
.mrich strong { color:var(--text-secondary); font-weight:600; }

.mstats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.mstat { background:#fff; border:1px solid var(--border-primary); border-left:4px solid var(--border-secondary); border-radius:var(--radius-sm); padding:9px 11px; }
.mstat .v { font-size:19px; line-height:25px; font-weight:600; color:var(--text-secondary); }
.mstat .l { font-size:11.5px; line-height:16px; color:var(--text-primary); }

.mtable { background:#fff; border:1px solid var(--border-primary); border-radius:var(--radius-sm); overflow:hidden; }
.mtable .row { display:grid; grid-template-columns:1.3fr 1.4fr max-content; gap:8px; align-items:center; padding:9px 12px; border-bottom:1px solid var(--border-disabled); font-size:13.5px; }
.mtable .row:last-child { border-bottom:none; }
.mtable .row .a { color:var(--text-secondary); }
.mtable .row .b { color:var(--text-primary); font-size:12.5px; text-align:right; }

.mplan { background:#fff; border:1px solid var(--border-primary); border-radius:var(--radius-sm); overflow:hidden; }
.mplan .ph { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--container-secondary-dark); }
.mplan .ph .rmx-icon { color:#fff; width:20px; height:20px; }
.mplan .ph .t { flex:1; font-size:14.5px; font-weight:500; color:#fff; }
.mplan .ph .badge { display:inline-flex; align-items:center; height:20px; padding:0 8px; border-radius:var(--radius-sm); background:var(--icon-attention); color:#fff; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
.mplan .prow { display:grid; grid-template-columns:.85fr 1.15fr; gap:12px; align-items:baseline; padding:8px 14px; border-bottom:1px solid var(--border-disabled); }
.mplan .prow .l { font-size:12.5px; color:var(--text-primary); }
.mplan .prow .v { font-size:13.5px; color:var(--text-secondary); font-variant-numeric:tabular-nums; }
.mplan .warn { display:flex; gap:9px; padding:10px 14px; background:var(--component-lozenge-caution); }
.mplan .warn .rmx-icon { color:var(--icon-attention); width:18px; height:18px; margin-top:1px; }
.mplan .warn .t { flex:1; font-size:12.5px; line-height:18px; color:var(--text-secondary); }

.mreport { background:#fff; border:1px solid var(--border-primary); border-radius:var(--radius-sm); overflow:hidden; }
.mreport .rh { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; background:var(--container-secondary-dark); }
.mreport .rh span.t { font-size:13.5px; font-weight:500; color:#fff; }
.mreport .rh .rmx-icon { width:18px; height:18px; color:var(--border-primary); cursor:pointer; }
.mreport .cols { display:grid; grid-template-columns:1.6fr .95fr .95fr .7fr; gap:8px; padding:8px 12px; border-bottom:1px solid var(--border-primary); font-size:11.5px; font-weight:600; color:var(--text-secondary); }
.mreport .cols span { text-align:right; }
.mreport .rrow { display:grid; grid-template-columns:1.6fr .95fr .95fr .7fr; gap:8px; align-items:center; padding:7px 12px; font:400 14px/20px 'Roboto',sans-serif; border-bottom:1px solid var(--border-disabled); }
.mreport .rrow span:not(:first-child) { text-align:right; font-variant-numeric:tabular-nums; }
.mreport .rrow.head { background:var(--container-tertiary); font-weight:600; }
.mreport .rrow.total { border-top:1px solid var(--border-primary); font-weight:600; }
.mreport .rrow .dir-up { color:var(--text-success); } .mreport .rrow .dir-bad { color:var(--text-error); } .mreport .rrow .dir-flat { color:var(--text-primary); }

.mtenants { display:flex; flex-direction:column; gap:6px; }
.mtenant-row { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--border-primary); border-radius:var(--radius-sm); padding:11px 13px; cursor:pointer; }
.mtenant-row:hover { border-color:var(--border-secondary); background:var(--container-tertiary); }
.mtenant-row .rmx-icon.person { width:22px; height:22px; color:var(--text-link); }
.mtenant-row .tmeta { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.mtenant-row .tmeta .name { font-size:14.5px; color:var(--text-secondary); }
.mtenant-row .tmeta .unit { font-size:12.5px; color:var(--text-primary); }
.mtenant-row .tmeta .veh { font-size:12.5px; color:var(--text-primary); }
.mtenant-row .chevron { color:var(--text-link); }

.mrecord { background:#fff; border:1px solid var(--border-primary); border-radius:var(--radius-sm); overflow:hidden; }
.mrecord .rh2 { display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--container-secondary-dark); }
.mrecord .rh2 .rmx-icon.person { width:24px; height:24px; color:#fff; }
.mrecord .rh2 .rname { flex:1; display:flex; flex-direction:column; gap:2px; }
.mrecord .rh2 .rname .n { font-size:15.5px; font-weight:500; color:#fff; }
.mrecord .rh2 .rname .m { font-size:11.5px; color:var(--border-primary); }
.mrecord .rh2 .rmx-icon.open { color:var(--border-primary); cursor:pointer; }
.mrecord .rbody { padding:14px; display:flex; flex-direction:column; gap:12px; }
.mrecord .vehicle-box { border:2px solid var(--border-secondary); background:var(--bg-hover); border-radius:var(--radius-sm); padding:11px 13px; display:flex; flex-direction:column; gap:3px; }
.mrecord .vehicle-box .vl { font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--text-link); }
.mrecord .vehicle-box .vv { font-size:15.5px; color:var(--text-secondary); }
.mrecord .vehicle-box .vm { font-size:12.5px; color:var(--text-primary); }
.mrecord .rfields { display:grid; grid-template-columns:repeat(2,1fr); gap:12px 18px; }
.mrecord .rfields .f .l { font-size:11.5px; color:var(--text-primary); display:block; }
.mrecord .rfields .f .v { font-size:13.5px; color:var(--text-secondary); }
.mrecord .second { display:flex; align-items:center; gap:9px; border-top:1px solid var(--border-disabled); padding-top:11px; }
.mrecord .second .rmx-icon { width:18px; height:18px; color:var(--text-disabled); }
.mrecord .second .t { font-size:12.5px; color:var(--text-primary); }

/* The follow-ups close the answer, so they get air above them and a hairline
   to separate them from the result rather than reading as one more row of it.
   The .content flex gap is 10px; this adds to it. */
.mfollow { margin-top: var(--spacing-md); padding-top: var(--spacing-md);
  border-top: 1px solid var(--border-disabled); }
.mfollow-label { font: 600 12px/16px 'Roboto',sans-serif; text-transform:uppercase;
  letter-spacing:.04em; color:var(--text-primary); margin-bottom: var(--spacing-xs); }
.mfollow-wrap { display:flex; flex-direction:column; gap:6px; }
.follow-chip { display:flex; align-items:center; gap:10px; border:1px solid var(--border-primary); background:#fff; border-radius:6px; padding:10px 12px; font-family:'Roboto',sans-serif; cursor:pointer; text-align:left; }
.follow-chip:hover { border-color:var(--border-secondary); background:var(--container-tertiary); }
.follow-chip .fl { flex:1; font-size:13.5px; line-height:20px; color:var(--text-secondary); }
.follow-chip .rmx-icon.chev { width:18px; height:18px; color:var(--text-link); }

.mprint { background:#fff; border:1px solid var(--border-primary); border-radius:var(--radius-sm); overflow:hidden; }
.mprint .pph { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border-primary); }
.mprint .pph .rmx-icon { color:var(--text-link); }
.mprint .pph .t { flex:1; font-size:14.5px; font-weight:500; color:var(--text-secondary); }
.mprint .pph .pages { font-size:12.5px; color:var(--text-primary); }
.mprint .pprow { display:grid; grid-template-columns:.8fr 1.2fr; gap:12px; align-items:baseline; padding:7px 14px; border-bottom:1px solid var(--border-disabled); }
.mprint .pprow .l { font-size:12.5px; color:var(--text-primary); } .mprint .pprow .v { font-size:13.5px; color:var(--text-secondary); }
.mprint .pfoot { display:flex; align-items:center; gap:8px; padding:11px 14px; background:var(--container-tertiary); }

.marticle { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--border-primary); border-radius:var(--radius-md); padding:11px 14px; cursor:pointer; }
.marticle:hover { border-color:var(--border-secondary); background:var(--container-tertiary); }
.marticle .lab { font:400 14px/20px 'Roboto',sans-serif; color:var(--text-disabled); white-space:nowrap; }
.marticle .t { flex:1; font-size:14.5px; color:var(--text-secondary); }
.marticle .rmx-icon { color:var(--text-link); cursor:pointer; }

.mnote { display:flex; align-items:flex-start; gap:9px; padding:9px 11px; border:1px solid var(--border-primary); border-radius:var(--radius-sm); background:var(--container-tertiary); }
.mnote .rmx-icon { width:17px; height:17px; color:var(--text-primary); margin-top:1px; }
.mnote .t { font-size:12.5px; line-height:18px; color:var(--text-secondary); }
.mnote .t a { display:block; margin-top:4px; }

.mactions { display:flex; flex-wrap:wrap; gap:var(--spacing-xs); }
/* DESIGN.md 7.1 — 36px tall, radius 4, 14px label, ~16px side padding. */
.mact-btn { height:36px; padding:0 16px; border-radius:var(--radius-sm);
  font:400 14px/20px 'Roboto',sans-serif; cursor:pointer; }
.mact-btn.primary { background:var(--background-primary-button); border:1px solid var(--border-secondary); color:#fff; } .mact-btn.primary:hover { background:var(--rmx-blue-hover); }
/* Secondary, to the letter: white on a 1px brand-blue border, brand-blue
   label, hovering to #EBF1F5. It had a border-primary hairline and gray text,
   which is not a state the Button component has. */
.mact-btn.secondary { background:var(--container-primary); border:1px solid var(--border-secondary); color:var(--text-link); }
.mact-btn.secondary:hover { background:var(--bg-hover); }
.mact-btn.secondary:disabled { border-color:var(--border-disabled); color:var(--text-disabled); }
.mact-btn:disabled { opacity:.5; cursor:default; }
/* Orion_Summarize Button — State=Default (RMX Components, Orion Assets) */
.mact-btn.orion-summarize { background:#fff; border:1px solid var(--border-secondary); color:var(--text-secondary); display:inline-flex; align-items:center; gap:8px; }
.mact-btn.orion-summarize:hover { background:var(--bg-hover); }
.mact-btn.orion-summarize svg { flex:none; }

.mlink { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--border-secondary); border-radius:var(--radius-md); padding:11px 14px; }
.mlink:hover { background:var(--bg-hover); text-decoration:none; }
.mlink .rmx-icon { color:var(--text-link); }
.mlink .lcol { flex:1; display:flex; flex-direction:column; }
.mlink .lcol .t { font-size:14.5px; font-weight:500; color:var(--text-link); }
.mlink .lcol .h { font-size:11.5px; color:var(--text-primary); }

.mtile-preview { background:#fff; border:1px solid var(--border-primary); border-radius:var(--radius-sm); overflow:hidden; }
.mtile-preview .th2 { display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border-bottom:1px solid var(--border-primary); }
.mtile-preview .th2 strong { font-size:14.5px; color:var(--text-secondary); }
.mtile-preview .tnote { padding:9px 12px; border-bottom:1px solid var(--border-primary); background:var(--container-tertiary); font-size:12.5px; line-height:18px; color:var(--text-primary); }
.mtile-preview .thead { display:grid; grid-template-columns:1.3fr 1.4fr .8fr; gap:8px; padding:8px 12px; border-bottom:1px solid var(--border-primary); background:var(--container-tertiary); font-size:11.5px; font-weight:600; color:var(--text-secondary); }
.mtile-preview .trow { display:grid; grid-template-columns:1.3fr 1.4fr .8fr; gap:8px; align-items:center; padding:9px 12px; border-bottom:1px solid var(--border-disabled); font-size:13.5px; }
.mtile-preview .trow .b { color:var(--text-primary); font-size:12.5px; }
.mtile-preview .tfoot { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:var(--container-tertiary); font-size:12.5px; color:var(--text-primary); }

.mpicker { background:#fff; border:1px solid var(--border-primary); border-radius:var(--radius-md); padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
.mpicker .pt { font-size:14.5px; font-weight:500; color:var(--text-secondary); }
.dash-opt { display:flex; align-items:center; gap:10px; border-radius:var(--radius-sm); padding:9px 11px; cursor:pointer; border:1px solid var(--border-primary); }
.dash-opt:hover { border-color:var(--border-secondary); }
.dash-opt.sel { border-color:var(--border-secondary); background:var(--bg-hover); }
.dash-opt .radio { width:15px; height:15px; flex:none; border-radius:999px; border:1px solid var(--border-primary); background:#fff; }
.dash-opt.sel .radio { border:5px solid var(--border-secondary); }
.dash-opt .dname { font-size:13.5px; color:var(--text-secondary); }
.dash-opt .dmeta { font-size:11.5px; color:var(--text-primary); }

.thinking-row { display:flex; gap:10px; align-items:center; }
.thinking-row .txt { font-size:13.5px; font-style:italic; color:var(--text-primary); }
.thinking-dots { display:flex; gap:5px; }
.thinking-dots span { width:7px; height:7px; border-radius:999px; background:var(--background-primary-button); animation: eh-pulse 1.2s ease-in-out infinite; }
.thinking-dots span:nth-child(2){animation-delay:.2s;} .thinking-dots span:nth-child(3){animation-delay:.4s;}

.orion-sheet { position:absolute; left:20px; right:20px; z-index:8; background:#fff; border:1px solid var(--border-primary); border-radius:var(--radius-md);
  box-shadow: 0px 2px 4px rgba(76,76,76,.06), 0px 8px 16px rgba(76,76,76,.14), 0px 2px 24px rgba(76,76,76,.1);
  padding:16px; display:flex; flex-direction:column; gap:10px; overflow:hidden; animation: eh-in .16s ease-out; }
/* New-chat screen: the sheet sits in normal flow right under the browse link and grows
   with the panel itself, instead of popping out as a floating overlay. */
.orion-sheet-inline { position:static; left:auto; right:auto; z-index:auto; flex:1; min-height:0;
  margin:0 20px 16px; box-shadow: 0px -1px 10px rgba(76,76,76,.02), 0px 4px 7.5px rgba(76,76,76,.08), 2px 2px 6px rgba(76,76,76,.08); }
/* Orion Assistant Overlay 17:94 — opened from the card, the sheet replaces the
   Browse link in place: full width of the card, 16 padding, 12 gap, radius 8,
   on the same border-primary hairline. No shadow here — it is a panel within a
   panel, not a thing floating over one. */
.orion-sheet.orion-sheet-in-card {
  position:static; left:auto; right:auto; z-index:auto;
  width:100%; margin:0; flex:none; min-height:0;
  padding:var(--spacing-md); gap:var(--spacing-sm);
  box-shadow:none;
  /* .orion-greet centres its whole column, and the sheet now sits inside it. */
  text-align:left;
}
.orion-sheet .sh { display:flex; align-items:center; justify-content:space-between; }
.orion-sheet .sh .t { font:600 16px/24px 'Roboto',sans-serif; color:var(--text-secondary); }
.orion-sheet .sh .rmx-icon { color:var(--text-primary); cursor:pointer; }
.cat-pills { display:flex; flex-wrap:wrap; gap:6px; }
.cat-pill { padding:7px 12px; border-radius:999px; font-size:12.5px; cursor:pointer; border:1px solid var(--border-primary); background:#fff; color:var(--text-primary); }
.cat-pill.sel { border-color:var(--border-secondary); background:var(--bg-hover); color:var(--text-link); }
.prompt-list { display:flex; flex-direction:column; gap:6px; flex:1; min-height:0; overflow:auto; }
.prompt-item { display:flex; align-items:center; gap:var(--spacing-xs); border:1px solid var(--border-primary); border-radius:var(--radius-sm); padding:10px 12px; cursor:pointer; }
.prompt-item:hover { border-color:var(--border-secondary); background:var(--container-tertiary); }
.prompt-item .pl { flex:1; font:400 14px/20px 'Roboto',sans-serif; color:var(--text-secondary); }
.prompt-item .rmx-icon.chev { width:18px; height:18px; color:var(--text-link); }

/* The composer floats over the conversation rather than sitting in a band of
   its own: it is lifted out of the column and hung above the footer, so the
   answer keeps running underneath it and the panel reads as one surface.

   No top border — the hairline is what cut the panel in two. .orion-body
   carries matching bottom padding (set from the composer's real height in
   syncComposerInset) so the last line of an answer can still be scrolled
   clear of the controls. */
/* `bottom` is written by syncComposerInset from the footer's real height.
   It cannot be a percentage: absolute positioning resolves against the
   nearest positioned ancestor, which is the panel — bottom:100% put the
   composer above the panel entirely, where overflow:hidden ate it. */
.orion-composer { position:absolute; left:0; right:0; bottom:0; z-index:7;
  border-top:none;
  /* Filled, but with the panel's own surface rather than white. .orion-panel
     lays a 6% brand-blue wash over white and the composer sits at the bottom
     of it, so repainting that exact pair leaves no seam — the controls have
     something solid to sit on and the bar still reads as part of the panel
     instead of a white band across it. --container-tertiary is two points
     off and shows as a faint edge against its neighbour. */
  background:linear-gradient(rgba(0,141,213,.06) 0 100%), var(--container-primary);
  padding:12px 18px 14px; display:flex; flex-direction:column; gap:8px; }
/* The composer at the foot of a conversation is the same Orion_Input Fields
   component, so it grows the same way. Snapped to the component's own values
   while here: it was 14.5px type (no such style) in a 6px radius (no such
   token) on 11/14 padding. */
.orion-ask { display:flex; align-items:flex-end; gap:var(--spacing-xs);
  border:1px solid var(--border-primary); border-radius:var(--radius-sm);
  padding:7px; background:var(--container-primary);
  box-shadow:0 1px 2px rgba(76,76,76,.08); }
.orion-ask textarea { flex:1; min-width:0; border:none; outline:none; background:transparent;
  font:400 14px/20px 'Roboto',sans-serif; color:var(--text-secondary);
  resize:none; overflow-y:hidden; display:block; padding:0; margin:0; }
.orion-ask textarea::placeholder { color:var(--text-primary); font-style:italic; }
.orion-ask .rmx-icon.send { width:20px; height:20px; color:var(--text-link); cursor:pointer; flex:none; }
.browse-btn { height:32px; padding:0 12px; border-radius:var(--radius-sm); font:400 14px/20px 'Roboto',sans-serif; display:inline-flex; align-items:center; gap:6px; cursor:pointer; background:#fff; border:1px solid var(--border-primary); color:var(--text-primary); }
.browse-btn.active { background:var(--bg-hover); border-color:var(--border-secondary); color:var(--text-link); }
.orion-disclaimer { text-align:center; font-size:12.5px; font-style:italic; color:var(--text-primary); }
.orion-footer { flex:none; position:relative; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 18px; border-top:1px solid var(--border-primary); background:var(--container-tertiary); }
.orion-footer span { font:400 14px/20px 'Roboto',sans-serif; color:var(--text-primary); }

@media (max-width: 1024px) {
  .orion-panel { width: calc(100vw - 32px); right:16px; top:16px; height: calc(100vh - 32px); }
}

/* Medium width — not enough room for 4 workspace cards side by side.
   Switch to an icon tab bar showing one full-width card at a time; the
   favorites masonry (column-width based) reflows its column count on its own. */
@media (max-width: 1300px) {
  .workspace-tabs { display:flex; }
  .workspace-columns { flex-direction: column; }
  .workspace-columns .ws-col { display:none; width:100%; }
  .workspace-columns .ws-col.tab-active { display:flex; }
}

/* Company Code drops before it can collide with a wide Command Launch bar. */
@media (max-width: 1150px) {
  .hide-medium { display: none !important; }
}

/* Compact header — Reports/Favorites icon buttons drop off too,
   leaving just Menu + Command Launch, and Bell + Avatar on the right. */
@media (max-width: 860px) {
  .hide-compact { display: none !important; }
  .cl-search { width: auto; max-width: none; flex: 1; }
  .app-header .zone.center { flex: 2; }
  .cl-iconbtn.menu { border-radius: var(--radius-sm); }
}


/* ==== Printed report + report viewer ==== */

/* ============================================================
   Printed report — styled per the Rent Manager Reports Guide
   (Figma "Reports Guide", Report with Sections template).
   Tokens are the report engine's own — blue-100 #2a75b8, blue-50
   #eef3fa, border-content #848484 — distinct from the app's RMX
   blue, matching real printed/exported Rent Manager reports.
   ============================================================ */
.rpt-page {
  width: 816px; min-height: 1056px; box-sizing: border-box; background: #fff;
  display: flex; flex-direction: column; gap: 14.4px;
  padding: 48px 48px 26.8px; margin: 0 auto;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #211e1e;
}
.rpt-header { display: flex; flex-direction: column; }
.rpt-title-row { display: flex; align-items: flex-end; justify-content: space-between; height: 27px; padding-bottom: 8px; border-bottom: 2px solid #2a75b8; color: #2a75b8; }
.rpt-title { font-size: 24px; font-weight: 300; }
.rpt-daterange { font-size: 14px; font-weight: 300; white-space: nowrap; }
.rpt-options { margin-top: 6px; background: #eef3fa; border-radius: 4px; height: 19.2px; box-sizing: border-box; display: flex; align-items: center; padding: 0 4.8px; font-size: 10px; font-style: italic; }
.rpt-subtitle { margin-top: 4px; font-size: 10px; font-style: italic; }

.rpt-body { display: flex; flex-direction: column; gap: 48px; flex: 1; }
.rpt-section, .rpt-component { display: flex; flex-direction: column; }
.rpt-section-label, .rpt-component-label { background: #eef3fa; border-radius: 4px; height: 19.2px; box-sizing: border-box; display: inline-flex; align-self: stretch; align-items: center; padding: 0 4.8px; margin-bottom: 6px; }
.rpt-component-label { align-self: flex-start; border-bottom: 1px solid #2a75b8; }
.rpt-section-label .lbl { font-size: 12px; font-weight: 600; color: #2a75b8; }
.rpt-component-label .lbl { font-size: 12px; font-weight: 300; color: #2a75b8; }

.rpt-row { display: grid; grid-template-columns: 1fr 90px 90px 90px 100px; column-gap: 6px; }
.rpt-cell { padding: 3.7px 0; font-size: 10px; }
.rpt-cell.amount { text-align: right; }
.rpt-headrow { border-bottom: 1px solid #848484; align-items: flex-end; padding-bottom: 6px; }
.rpt-total { border-top: 1px solid #848484; margin-top: 2px; padding-top: 6px; color: #2a75b8; font-weight: 600; }
.rpt-pl-subtotal { font-weight: 600; }
.rpt-pl-grand { border-top: 1px solid #848484; margin-top: 2px; padding-top: 6px; }

.rpt-crow { display: flex; justify-content: space-between; gap: 24px; max-width: 320px; padding: 3.7px 0; font-size: 10px; }
.rpt-csum { border-top: 1px solid #848484; margin-top: 2px; padding-top: 6px; font-weight: 600; }

.rpt-footer { margin-top: auto; border-top: 2px solid #2a75b8; display: flex; align-items: center; justify-content: space-between; padding: 1px 0 1px 9.6px; }
.rpt-foot-left { display: flex; align-items: center; gap: 32px; font-size: 10px; font-weight: 300; }
.rpt-foot-ico { font-size: 16px; color: #2a75b8; vertical-align: -3px; }
.rpt-foot-page { background: #eef3fa; border-radius: 4px; height: 19.2px; box-sizing: border-box; display: flex; align-items: center; padding: 0 4.8px; font-size: 10px; font-style: italic; }

/* ============================================================
   Report viewer — where Print / PDF on an analyzed result lands
   ------------------------------------------------------------
   The pages inside it are the same .rpt-* document above, so the
   report you look at is the report that prints. This block only
   adds the viewer around it, plus a few document blocks the
   Reports Guide template does not cover (an executive summary
   paragraph, a key-figure band, a numbered list), all built from
   the report engine's own tokens — blue-100 #2a75b8, blue-50
   #eef3fa, border-content #848484.

   Viewer chrome is not RMX chrome: Express embeds a document
   viewer and its greys belong to the viewer. Toolbar #4f4f4f,
   page gutter #282828, chips rgba(12,14,15,.8) — measured off
   the Orion Report Analysis design (nodes 2258:44135 / 44163).
   ============================================================ */
:root { --pdf-toolbar:#4f4f4f; --pdf-gutter:#282828; --pdf-chip:rgba(12,14,15,.8); }

.rv-shell { display:flex; flex-direction:column; height:calc(100vh - 88px); min-height:420px; }

/* ---------- Toolbar: title / page + zoom / actions ---------- */
.rv-toolbar { display:flex; align-items:center; gap:16px; height:60px; flex:none; padding:0 10px; background:var(--pdf-toolbar); color:#fff; }
.rv-toolbar button { display:inline-flex; align-items:center; justify-content:center; background:none; border:0; padding:0; cursor:pointer; color:#fff; }
.rv-toolbar .rmx-icon { width:20px; height:20px; }
.rv-name { display:flex; align-items:center; gap:16px; flex:1 0 0; min-width:0; }
.rv-name .t { font-size:14px; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rv-pager { display:flex; align-items:center; gap:24px; flex:none; }
.rv-pageno { display:flex; align-items:center; gap:8px; font-size:14px; }
.rv-zoom { display:flex; align-items:center; gap:8px; padding:0 8px; border-left:1px solid rgba(255,255,255,.9); border-right:1px solid rgba(255,255,255,.9); }
.rv-chip { padding:0 8px; background:var(--pdf-chip); font-size:14px; color:#fff; }
.rv-actions { display:flex; align-items:center; gap:12px; flex:1 0 0; justify-content:flex-end; }

/* ---------- Body: thumbnail rail + scrolling page area ---------- */
.rv-body { display:flex; flex:1; min-height:0; background:var(--pdf-gutter); position:relative; }
.rv-thumbs { width:180px; flex:none; overflow-y:auto; padding:24px 0; display:flex; flex-direction:column; align-items:center; gap:20px; }
.rv-thumb { display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:0; padding:0; cursor:pointer; }
.rv-thumbbox { display:block; width:120px; height:155px; overflow:hidden; background:#fff; border:2px solid transparent; border-radius:2px; }
.rv-thumb[aria-current="true"] .rv-thumbbox { border-color:var(--border-secondary); }
.rv-thumbscale { display:block; transform-origin:top left; pointer-events:none; }
.rv-thumb .n { font-size:13px; color:#fff; }
.rv-stage { flex:1; min-width:0; overflow:auto; display:flex; justify-content:center; align-items:flex-start; padding:24px 0 40px; }
.rv-zoomwrap { transform-origin:top center; display:flex; flex-direction:column; align-items:center; gap:24px; }
/* Pages are exactly letter-height in the viewer, which is what makes the
   page count and the thumbnail rail tell the truth. */
.rv-zoomwrap > .rpt-page, .rv-thumbs .rpt-page { height:1056px; box-shadow:0 4px 16px rgba(0,0,0,.45); }
.rv-thumbs .rpt-page { box-shadow:none; }
/* Analyze with Orion — back to the corner-anchored chat panel (not the
   centered modal), with a trigger that starts as a plain icon bubble and
   expands to reveal its label on hover, collapsing back when the mouse
   leaves. It still disappears once the panel is open and reappears when
   the panel closes. */
.rv-orion { position:absolute; right:20px; bottom:20px; z-index:2; display:flex; align-items:center; justify-content:flex-end;
  height:40px; width:40px; padding:0; border-radius:999px; cursor:pointer; overflow:hidden; border:1.5px solid transparent;
  background: linear-gradient(#fff,#fff) padding-box, var(--orion-border-gradient) border-box;
  box-shadow:var(--shadow-orion); font:500 14px 'Roboto',sans-serif; color:var(--text-secondary);
  transition: width .2s ease; white-space:nowrap; }
.rv-orion:hover { width:190px; background: linear-gradient(var(--bg-hover),var(--bg-hover)) padding-box, var(--orion-border-gradient) border-box; }
.rv-orion .t { width:0; overflow:hidden; opacity:0; transition: width .2s ease, opacity .12s ease; }
.rv-orion:hover .t { width:138px; opacity:1; padding-left:14px; }
/* The icon box fills whatever the button's content box actually is, rather
   than being pinned to 40px. The button is 40px wide with a 1.5px border, so
   a fixed 40px child overflowed by 3px and justify-content:flex-end pushed it
   off-centre — 10px of gap on one side, 12px on the other. flex:1 lets it
   take the real space and centre the mark in it, collapsed or expanded. */
.rv-orion .ico { flex:1 0 auto; min-width:0; height:100%;
  display:flex; align-items:center; justify-content:center; }

.rv-orion-chat { position:absolute; right:20px; bottom:20px; z-index:5;
  width:380px; height:520px; max-height:calc(100% - 40px);
  border:1px solid transparent; border-radius:var(--radius-md);
  background-image:
    linear-gradient(180deg, rgba(255,255,255,.15) 0%, rgba(0,141,213,.06) 100%),
    linear-gradient(var(--container-primary), var(--container-primary)),
    var(--orion-border-gradient);
  background-origin: padding-box, padding-box, border-box;
  background-clip: padding-box, padding-box, border-box;
  box-shadow: 0 0 12.6px rgba(0,141,213,.2);
  display:flex; flex-direction:column; overflow:hidden; animation: eh-in .18s ease-out; }
.rv-orion-chat[hidden] { display:none; }
.rv-orion-chat .orion-body { padding:16px; display:flex; flex-direction:column; }
.rv-orion-chat .orion-composer { padding:10px 16px 12px; }
/* Same message list rhythm as the main assistant's #messagesWrap. */
#rvChatMessages { display:flex; flex-direction:column; gap:var(--spacing-2xl); }
.rv-analysis { font-size:13.5px; line-height:1.55; color:var(--text-secondary); }
.rv-analysis p { margin:0 0 12px; }
.rv-analysis p:last-child { margin-bottom:0; }
.rv-analysis ul, .rv-analysis ol { margin:0 0 12px; padding-left:16px; }
.rv-analysis ul:last-child, .rv-analysis ol:last-child { margin-bottom:0; }
.rv-analysis li { margin-bottom:5px; }
.rv-analysis li ul { margin:5px 0 0; }
.rv-analysis h4 { font-size:13.5px; font-weight:400; margin:0 0 4px; }

/* Message action row. Icon buttons are DESIGN.md's Action text button
   (transparent, hover rgba(0,0,0,.05), 16px icon) recolored gray per
   product direction — gray at rest, blue on hover, same shape everyone
   else's action-text buttons use. Add to Report is harvested straight off
   the actual Orion_Overlay instance in the Orion Report Analysis file
   (node 2242:5232, Figma node I2242:5232;7793:364;2242:4405) — one
   unified #008DD5 Button, h36, r4, 8px padding, label + 20px
   arrow_drop_down in the same box. No divider, no second segment; that
   was DESIGN.md's generic Split recipe, not what this specific screen
   actually uses. The dropdown it opens (First Page / Last Page) is this
   prototype's own addition — the mock only shows the trigger. */
.rv-msg-actions { display:flex; align-items:center; gap:2px; }
.ricon-btn { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border:none; background:transparent; border-radius:var(--radius-sm); color:var(--icon-tertiary); cursor:pointer; flex:none; }
.ricon-btn:hover { background:rgba(0,0,0,.05); }
.ricon-btn .rmx-icon { width:16px; height:16px; }
.rv-split { position:relative; display:flex; margin-left:auto; }
