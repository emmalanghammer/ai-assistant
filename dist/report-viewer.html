.rv-add-btn { display:inline-flex; align-items:center; height:36px; padding:8px; background:var(--background-primary-button); color:#fff; border:none; border-radius:var(--radius-sm); cursor:pointer; }
.rv-add-btn:hover { background:var(--rmx-blue-hover); }
.rv-add-btn .lbl { padding:0 8px; font:400 14px/1 'Roboto',sans-serif; white-space:nowrap; }
.rv-add-btn .rmx-icon { width:20px; height:20px; width:20px; height:20px; display:flex; align-items:center; justify-content:center; }
.rv-add-menu { position:absolute; bottom:100%; right:0; margin-bottom:4px; background:#fff; border:1px solid var(--border-primary); border-radius:var(--radius-sm); box-shadow:var(--shadow-md); min-width:130px; z-index:20; overflow:hidden; }
.rv-add-menu[hidden] { display:none; }
.rv-add-menu button { display:block; width:100%; text-align:left; padding:8px 12px; border:none; background:none; font:400 13px 'Roboto',sans-serif; color:var(--text-secondary); cursor:pointer; }
.rv-add-menu button:hover { background:var(--bg-hover); }
.rv-enhance-wrap { position:relative; display:inline-flex; }
.rv-enhance-menu { position:absolute; top:100%; left:0; margin-top:4px; background:#fff; border:1px solid var(--border-primary); border-radius:var(--radius-sm); box-shadow:var(--shadow-md); min-width:140px; z-index:20; overflow:hidden; }
.rv-enhance-menu[hidden] { display:none; }
.rv-enhance-menu button { display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:8px 12px; border:none; background:none; font:400 13px 'Roboto',sans-serif; color:var(--text-link); cursor:pointer; }
.rv-enhance-menu button:hover { background:var(--bg-hover); }
.rv-enhance-menu .rmx-icon { width:16px; height:16px; color:var(--text-link); }

/* When a response is added to the report itself (see addToReport()), it
   keeps the analysis's own Roboto/navy body text — per the reference
   (Orion Report Analysis, node 2286:2517), an inserted analysis page does
   NOT get reset to the report's tiny Segoe UI print scale; only the
   section band above it ("Executive Summary", .rpt-section-label) is
   report chrome. "Income:"/"Expenses:" etc. are plain text lines, not
   bold or blue — same as .rv-analysis, so this is really the same look,
   just confirmed independently against this second reference. */
.rv-analysis-page { font-size:13.5px; line-height:1.55; color:var(--text-secondary); }
.rv-analysis-page p { margin:0 0 12px; }
.rv-analysis-page p:last-child { margin-bottom:0; }
.rv-analysis-page ul, .rv-analysis-page ol { margin:0 0 12px; padding-left:16px; }
.rv-analysis-page ul:last-child, .rv-analysis-page ol:last-child { margin-bottom:0; }
.rv-analysis-page li { margin-bottom:5px; }
.rv-analysis-page li ul { margin:5px 0 0; }
.rv-analysis-page h4 { font-size:13.5px; font-weight:400; margin:0 0 4px; }

/* Editable draft — DESIGN.md §7.1's in-place-editing outline (1px dashed
   #008DD5) around the whole proposed analysis, styled with .rv-analysis
   so the preview reads exactly like the document it is about to become. */
.rv-draft { border:1px dashed var(--border-secondary); border-radius:var(--radius-sm); padding:10px 12px; max-height:320px; overflow-y:auto; }
.rv-draft [contenteditable] { outline:none; }
.rv-draft .rv-analysis { margin:0; }

/* Toast — DESIGN.md §7.4 verbatim: solid status-color bar (success
   #6EB744, help/info navy #13314C), 16px padding, r4, toast shadow, a
   32px white icon and 16px SemiBold white message, anchored to a page
   corner rather than bottom-center. top:100px clears the app header
   (48px) + context bar (40px) — both position:sticky — plus a 12px gap,
   so the toast never sits on top of the header's own icons. */
/* Centred across the page, not tucked in a corner — a confirmation is the
   one thing in here that must not be missed. */
.rv-toast { position:fixed; top:100px; left:50%; transform:translateX(-50%); z-index:200; max-width:420px; display:flex; align-items:center; gap:12px; padding:16px; border-radius:var(--radius-sm); background:var(--container-secondary-dark); color:#fff; box-shadow:var(--shadow-toast); }
.rv-toast.success { background:var(--component-toast-success); }
.rv-toast .rmx-icon { width:32px; height:32px; flex:none; }
.rv-toast .msg { font:600 16px/1.3 'Roboto',sans-serif; }
@media (max-width: 1000px) { .rv-thumbs { display:none !important; } }

/* ---------- Document blocks the Reports Guide template leaves open ---------- */
.rptx-para { margin:0; padding:3.7px 0; font-size:10px; line-height:1.5; }
.rptx-li { display:grid; grid-template-columns:16px 1fr; column-gap:6px; padding:3.7px 0; font-size:10px; line-height:1.5; }
.rptx-li .n { color:#2a75b8; font-weight:600; }
.rptx-stats { display:flex; gap:10px; padding:6px 0 2px; }
.rptx-stat { flex:1; padding:6px 9px; background:#eef3fa; border-radius:var(--radius-sm); }
.rptx-stat .v { font-size:16px; line-height:20px; color:#2a75b8; font-variant-numeric:tabular-nums; }
.rptx-stat .l { font-size:9px; line-height:13px; color:#666666; }
.rptx-orion { display:flex; align-items:center; gap:8px; padding:6px 9px; background:#eef3fa; border-radius:var(--radius-sm); }
.rptx-orion svg { flex:none; }
.rptx-orion .t { font-size:9.5px; line-height:13px; font-style:italic; color:#2a75b8; }
/* A printed report flags an exception with colour on the number, not a lozenge. */
.rpt-cell.tone-red   { color:#bc2a30; font-weight:600; }
.rpt-cell.tone-amber { color:#b45309; font-weight:600; }
.rpt-cell.tone-green { color:#3f7a25; }
.rpt-cell.muted      { color:#666666; }
.rpt-row.rptx-sub .rpt-cell { color:#2a75b8; font-weight:600; padding-top:8px; }


/* ==== Print dialog ==== */

/* ============================================================
   Print overlay — a built, not borrowed, print dialog
   ------------------------------------------------------------
   Recreates the OS print dialog (dark settings pane, light page
   preview, page-number badge) as an in-page overlay rather than
   calling window.print(), so it behaves like the rest of the
   prototype: closable, restyleable, and always on top of the app
   instead of outside it. Colors are the dialog's own — dark pane
   #202124, hairline rgba(255,255,255,.25) — not RMX tokens; this
   is chrome being imitated, not an Express surface.
   ============================================================ */
#printOverlay { position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center; }
.po-backdrop { position:absolute; inset:0; background:rgba(0,0,0,.55); }
.po-dialog { position:relative; display:flex; width:min(1100px, 92vw); height:min(760px, 88vh); border-radius:12px; overflow:hidden; box-shadow:0 24px 64px rgba(0,0,0,.45); }

.po-preview { position:relative; flex:1 1 62%; background:#e8eaed; overflow:hidden; }
.po-scroll { position:absolute; inset:0; overflow:auto; padding:32px 0 48px; }
.po-pages { display:flex; flex-direction:column; align-items:center; gap:24px; transform-origin:top center; }
.po-pages .rpt-page { height:1056px; box-shadow:0 4px 16px rgba(0,0,0,.35); }
.po-pagebadge { position:absolute; top:12px; left:12px; z-index:2; background:rgba(32,33,36,.88); color:#fff; font-size:12px; line-height:1; padding:6px 11px; border-radius:12px; }

.po-settings { flex:0 0 340px; background:#202124; color:#e8eaed; display:flex; flex-direction:column; padding:28px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
.po-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; }
.po-title { font-size:26px; font-weight:500; }
.po-count { font-size:13px; color:#9aa0a6; }
.po-field { margin-bottom:20px; }
.po-label { font-size:13px; color:#9aa0a6; margin-bottom:7px; }
.po-select { display:flex; align-items:center; gap:8px; height:44px; padding:0 12px; border:1px solid rgba(255,255,255,.25); border-radius:8px; cursor:pointer; font-size:14px; }
.po-select:hover { background:rgba(255,255,255,.06); }
.po-select .po-val { flex:1; }
.po-select .rmx-icon { width:18px; height:18px; color:#9aa0a6; }
.po-more { display:flex; align-items:center; justify-content:space-between; padding:12px 0; margin-top:2px; border-top:1px solid rgba(255,255,255,.14); cursor:pointer; font-size:14px; }
.po-more:hover { color:#fff; }
.po-more .rmx-icon { width:20px; height:20px; color:#9aa0a6; }
.po-more-fields { padding-top:4px; }
.po-actions { margin-top:auto; display:flex; justify-content:flex-end; gap:10px; padding-top:20px; }
.po-btn { height:36px; padding:0 20px; border-radius:18px; font-size:14px; font-weight:500; cursor:pointer; border:none; font-family:inherit; }
.po-cancel { background:transparent; border:1px solid rgba(255,255,255,.3); color:#e8eaed; }
.po-cancel:hover { background:rgba(255,255,255,.08); }
.po-save { background:#a8c7fa; color:#062e6f; }
.po-save:hover { background:#c2d9fb; }
.po-msg { position:absolute; left:50%; bottom:28px; transform:translateX(-50%); z-index:302; background:rgba(32,33,36,.95); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; box-shadow:var(--shadow-toast); }
@media (max-width: 760px) { .po-dialog { flex-direction:column; width:94vw; height:90vh; } .po-settings { flex:0 0 auto; } }
/* ==== My Workspace dashboard ==== */

.workspace-hero, .workspace-columns, .workspace-tabs { position:relative; z-index:1; }
.workspace-hero { text-align: center; padding: 0 0 32px; display:flex; flex-direction:column; align-items:center; }
.workspace-tabs { display:none; justify-content:center; gap:48px; padding:0 24px 32px; }
.workspace-tabs button { background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; color:var(--text-secondary); font:400 14px 'Roboto',sans-serif; }
.workspace-tabs button .rmx-icon { width:24px; height:24px;; color:var(--text-secondary); }
.workspace-tabs button.active { color:var(--text-link); }
.workspace-tabs button.active .rmx-icon { color:var(--text-link);  }
/* RMX Pages 4969:70308 — the hero is Web/Heading/L/Regular over
   Web/Heading/M/Regular, both centred, both #575353. That grey is a literal in
   the page design, not a Foundations token (the nearest is --text-primary
   #666666); see PROTOTYPE.md. */
.workspace-hero .line1 { font: 400 24px/32px 'Roboto',sans-serif; color: #575353; margin:0; }
.workspace-hero .line2 { font: 400 20px/28px 'Roboto',sans-serif; color: #575353; margin:14px 0 0; }
.workspace-columns { display: flex; gap: 16px; padding: 0 24px 40px; align-items: stretch; }
/* Each column wraps its Tile, so the column identity and the responsive tab
   state sit on .ws-col and the tagged Tile keeps only rmx-* classes. */
.workspace-columns .ws-col { min-width: 0; display: flex; }
.workspace-columns .ws-col > .rmx-tile { flex: 1; min-width: 0;
  background: rgba(255, 255, 255, .85); border: none;
  border-top: 5px solid var(--border-secondary); border-radius: var(--radius-sm);
  box-shadow: var(--shadow-tile); min-height: 560px; }
.workspace-columns .ws-col.favorites { flex: 510 1 0; }
.workspace-columns .ws-col.reports   { flex: 263 1 0; }
.workspace-columns .ws-col.orion-col { flex: 263 1 0; }
.workspace-columns .ws-col.announce  { flex: 285 1 0; }
.workspace-columns .ws-col.training  { flex: 218 1 0; }
.workspace-columns .ws-col.reports  > .rmx-tile { border-top-color: var(--icon-success); }
.workspace-columns .ws-col.announce > .rmx-tile { border-top-color: var(--icon-attention); }
.workspace-columns .ws-col.training > .rmx-tile { border-top-color: var(--icon-notice);
  box-shadow: 0 3px 6px rgba(0, 0, 0, .25); }
/* A workspace Tile header has no blue underline and a 20px title — Tile
   Style=Workspace, not Style=Dashboard. */
.workspace-columns .rmx-tile__header { border-bottom: none; min-height: auto;
  padding: var(--spacing-md) var(--spacing-md) 0; }
.workspace-columns .rmx-tile__header .rmx-tile__title { font: 400 20px/28px 'Roboto', sans-serif;
  color: var(--text-primary); }
.workspace-columns .rmx-tile__header .rmx-icon { width: 16px; height: 16px;
  color: var(--text-primary); }
/* Masonry: cards hug their own content height and flow into columns that fill
   gaps instead of splitting into fixed groups. Always at least 2 columns —
   3 when there's ample room, 1 only once the tile itself is mobile-narrow.
   Column count reads the tile's own width (container query), since this tile
   renders at very different widths depending on the workspace layout. */
.rmx-tile.favorites .rmx-tile-body { container-type: inline-size; }
.ws-cardcolumns { column-count:2; column-gap:16px; }
@container (min-width: 620px) { .ws-cardcolumns { column-count:3; } }
@container (max-width: 380px) { .ws-cardcolumns { column-count:1; } }
.ws-cardcolumns .wf-item { margin-bottom:16px; break-inside:avoid; }
.ws-cardlist { display: flex; flex-direction: column; gap: 12px; }
.wf-item { display:flex; gap:10px; background:#fff; border-radius:var(--radius-sm); padding:12px;
  box-shadow: 0px -2px 20px -5px rgba(76,76,76,.08), 0px 4px 10px -10px rgba(76,76,76,.1), 1px 2px 12px 1px rgba(76,76,76,.1); }
.wf-item .ico { width:42px; height:42px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; color:#fff; flex:none; }
.wf-item .ico .rmx-icon { width:24px; height:24px;; }
.wf-item .body { display:flex; flex-direction:column; gap:8px; min-width:0; flex:1; }
.wf-item .body .t { font:600 14px/20px 'Roboto',sans-serif; color:var(--text-primary); margin:0; }
.wf-item .body .links { display:flex; flex-direction:column; gap:2px; }
.wf-item .body a { font-size:14px; line-height:20px; color:var(--text-link); }
#orionTilesCol { display:none; }
.orion-tile-card { background:#fff; border:1px solid var(--border-primary); border-radius:var(--radius-sm); overflow:hidden; }
.orion-tile-card .oth { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-bottom:1px solid var(--border-primary); }
.orion-tile-card .oth strong { font-size:14px; color:var(--text-secondary); }
.orion-tile-card .otnote { padding:8px 12px; background:var(--container-tertiary); border-bottom:1px solid var(--border-primary); font-size:12.5px; color:var(--text-primary); }
.orion-tile-card .othead { display:grid; grid-template-columns:1.3fr 1.4fr .8fr; gap:8px; padding:6px 12px; background:var(--container-tertiary-dark); color:#fff; font-size:11.5px; font-weight:500; letter-spacing:.5px; }
.orion-tile-card .otrow { display:grid; grid-template-columns:1.3fr 1.4fr .8fr; gap:8px; align-items:center; padding:7px 12px; border-bottom:1px solid var(--border-disabled); font:400 14px/20px 'Roboto',sans-serif; color:var(--text-secondary); }
.orion-tile-card .otfoot { display:flex; justify-content:space-between; padding:6px 12px; background:var(--container-tertiary); font-size:12px; color:var(--text-primary); }

/* Announcements card items */
.announce-item { background:#fff; border-radius:var(--radius-sm); padding:12px; display:flex; flex-direction:column; gap:10px;
  box-shadow: 0px -2px 20px -5px rgba(76,76,76,.08), 0px 4px 10px -10px rgba(76,76,76,.1), 1px 2px 12px 1px rgba(76,76,76,.1); }
.announce-item .ahead { display:flex; gap:10px; justify-content:space-between; align-items:flex-start; }
.announce-item .ahead .t { font:600 14px/20px 'Roboto',sans-serif; color:var(--text-secondary); margin:0; }
.announce-item .ahead .d { font: italic 400 12px/1.4 'Roboto',sans-serif; color:var(--text-disabled); margin:2px 0 0; }
.new-badge { background:var(--component-main-header); color:var(--text-inverse); font:600 12px/20px 'Roboto',sans-serif; border-radius:5px; padding:0 8px; height:20px; display:inline-flex; align-items:center; flex:none; white-space:nowrap; }
.announce-item .desc { font-size:14px; line-height:20px; color:var(--text-primary); margin:0; }
.announce-item .actions-row { display:flex; justify-content:space-between; }
.announce-item .actions-row button { background:none; border:none; color:var(--text-link); font:400 14px 'Roboto',sans-serif; cursor:pointer; padding:0; }
.announce-item .actions-row button:hover { text-decoration:underline; }

/* My Training card */
.training-card { background:#fff; box-shadow: var(--shadow-md); border-radius:5px; padding:24px 12px; display:flex; flex-direction:column; align-items:center; gap:20px; }
.training-card .rmu { text-align:center; }
.training-card .rmu .name { font:600 18px/24px 'Roboto',sans-serif; color:var(--text-secondary); }
.training-card .rmu .sub { font:600 12px/16px 'Roboto',sans-serif; letter-spacing:2.5px; color:var(--icon-attention); }
.training-card .desc { font-size:14px; line-height:20px; text-align:center; color:var(--text-primary); margin:0; }
.training-form { display:flex; flex-direction:column; gap:12px; width:100%; align-items:center; }
.training-input { width:100%; height:48px; background:var(--container-tertiary); border:1px solid var(--border-primary); display:flex; align-items:center; gap:10px; padding:0 8px; box-sizing:border-box; }
.training-input .rmx-icon { color:var(--text-disabled); width:20px; height:20px; }
.training-input input { border:none; background:none; outline:none; font-size:16px; color:var(--text-secondary); flex:1; min-width:0; }
.training-input input::placeholder { color:var(--text-disabled); }
.training-signin { background:var(--background-tertiary-button); color:#fff; font:500 16px 'Roboto',sans-serif; width:88px; height:48px; border:none; border-radius:var(--radius-sm); cursor:pointer; }
.training-signin:hover { background:#f9b479; }


/* ==== Entity detail page — composition ====
   DESIGN.md §6.4 describes how a detail page is composed; RMX Components
   defines the parts (Scoreboard Header, Tabs, Tile, Action Bar) but not the
   arrangement, so the gaps and the Scoreboard's internal rows live here.
   Measurements are DESIGN.md's: 20px between page sections and tiles,
   40px between the identity row's items, 32px between the meta items. */

.rmx-shell > .rmx-page { display: flex; flex-direction: column; gap: var(--spacing-lg); }
.rmx-tilerow { display: flex; gap: var(--spacing-lg); align-items: stretch; }
.rmx-tilerow > .rmx-tile { flex: 1; min-width: 0; }

/* Scoreboard Header — Tenant Scoreboard, node 11560:8512. 112px tall, a 16px
   #425A70 colour bar, then content at 16/32 padding. One row, space-between:
   identity and meta on the left, figures and Split Buttons on the right. */
.rmx-scoreboard { box-shadow: var(--shadow-sm); min-height: 112px; }
.rmx-scoreboard__content { display: block; padding: var(--spacing-md) var(--spacing-2xl); }
.sb-row { display: flex; align-items: center; justify-content: space-between;
  gap: var(--spacing-md); flex-wrap: wrap; height: 100%; }
.sb-leading { display: flex; flex-direction: column; justify-content: center;
  gap: var(--spacing-md); }

/* Identity row: 40px gaps, 32px tall. Name is Web/Paragraph/L/SemiBold; the
   account number is the same size in italic, which is the one place italic is
   not a placeholder. */
.sb-identity { display: flex; align-items: center; gap: var(--spacing-3xl); flex-wrap: wrap; }
.sb-name { font: 600 16px/24px 'Roboto', sans-serif; color: var(--text-secondary); }
.sb-account { font: italic 400 16px/24px 'Roboto', sans-serif; color: var(--text-secondary); }

/* Meta row: Scoreboard Items, Style=Icon Item — 20px tall, 32px apart. */
.sb-meta { display: flex; align-items: center; gap: var(--spacing-2xl); flex-wrap: wrap; }
.sb-item { display: inline-flex; align-items: center; gap: var(--spacing-xs);
  height: 20px; font-size: 14px; color: var(--text-secondary); }
.sb-item .rmx-icon { color: var(--icon-tertiary); }

/* Trailing: the figures column then the buttons, 32px apart. */
.sb-trailing { display: flex; align-items: center; gap: var(--spacing-2xl); }
.sb-figures { display: flex; flex-direction: column; align-items: flex-end;
  gap: var(--spacing-lg); }
/* Balance Item — label, then the value right-aligned in its own box. */
.sb-balance { display: inline-flex; align-items: baseline; gap: var(--spacing-xl);
  font-size: 16px; color: var(--text-secondary); }
.sb-balance .v { min-width: 86px; text-align: right; font-weight: 600; }
.sb-buttons { display: flex; flex-direction: column; gap: var(--spacing-xs); }
.sb-buttons .rmx-split { width: 153px; }
.sb-buttons .rmx-split__main { flex: 1; justify-content: center; }

/* The Action Bar is a full-height rail pinned to the right edge of the page. */
/* A detail page sits on the grey ground (#F2F2F2), with the Tiles as the
   white surfaces on top of it. */
.rmx-shell { min-height: calc(100vh - 88px); background: var(--background-ui-secondary); }

/* A screen whose content manages its own padding — the workspace dashboard
   and the report viewer both run edge to edge. */
.rmx-page--flush { padding: 0; background: transparent; }


/* ==== Orion entry point in the app bar ====
   The round Orion mark between Command Launch and the account block.
   Header (app bar) has no slot and no Orion variant, so this is an
   extension of the component, not an instance of one — see PROTOTYPE.md,
   "Worth raising". Everything else in the bar is the real component. */

.orion-entry { width: 34px; height: 34px; flex: none; border-radius: var(--radius-round);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  position: relative; background: none; border: 0; padding: 0;
  transition: background .15s ease-out; }
.orion-entry svg { display: block; }
.orion-entry:hover { background: var(--component-command-launch); }
.orion-entry.open  { background: var(--component-command-launch); }
/* Pulses until it has been opened once, then stops for good. */
.orion-entry.pulsing { animation: orion-ring 2.4s ease-out infinite; }
@keyframes orion-ring {
  0%   { box-shadow: 0 0 0 0 rgba(0,141,213,.55); }
  70%  { box-shadow: 0 0 0 10px rgba(0,141,213,0); }
  100% { box-shadow: 0 0 0 0 rgba(0,141,213,0); }
}

.orion-tooltip { position: absolute; top: 44px; right: 0; z-index: 60;
  background: var(--component-main-header); color: var(--text-inverse);
  font: 400 14px/20px 'Roboto', sans-serif; padding: var(--spacing-xxs) var(--spacing-xs);
  border-radius: var(--radius-sm); white-space: nowrap;
  box-shadow: var(--shadow-md); pointer-events: none; }
.orion-tooltip[hidden] { display: none; }
.orion-tooltip::after { content: ''; position: absolute; top: -4px; right: 14px;
  width: 8px; height: 8px; background: var(--component-main-header); transform: rotate(45deg); }

/* Notification bell + count. The bell is part of Header (app bar); the count
   badge is the prototype's own, since the library component has no counter. */
.notif-bell { position: relative; display: inline-flex; align-items: center; flex: none; }
.notif-badge { position: absolute; top: -7px; right: -8px; min-width: 16px; height: 16px;
  padding: 0 var(--spacing-xxs); border-radius: var(--radius-round);
  background: var(--icon-attention); color: var(--text-inverse);
  font: 600 12px/16px 'Roboto', sans-serif;
  display: flex; align-items: center; justify-content: center; }

/* Controls are 32px inside a bar, not the standard 36 (DESIGN.md §1.4).
   rmx.css sizes every button 36, so the context bar's own actions are
   brought down here rather than in the foundation. */
.rmx-contextbar .rmx-btn { height: 32px; }
.rmx-contextbar__action { color: var(--text-ondark); }
.rmx-contextbar__back { display: inline-flex; align-items: center; gap: var(--spacing-xxs);
  color: var(--text-ondark); font-size: 14px; }
.rmx-contextbar__sub { color: var(--text-ondark); opacity: .8;
  padding-left: var(--spacing-sm); border-left: 1px solid rgba(255, 255, 255, .4); }

/* ==== The assistant on a narrow screen ====
   The panel is anchored under Command Launch and sized from the app bar,
   which has no room below the tablet breakpoint. There it becomes a
   full-screen sheet instead — the pattern RMX uses for any floating
   surface that cannot fit. positionOrionPanel() stops writing inline
   geometry at this width so these rules are not fighting it. */
@media (max-width: 720px) {
  .orion-panel {
    position: fixed;
    inset: 48px var(--spacing-xs) var(--spacing-xs);
    width: auto !important;
    left: var(--spacing-xs) !important;
    top: 56px !important;
    max-width: none;
    min-width: 0;
    max-height: none !important;
    height: auto;
  }
  /* Dragging and resizing a full-screen sheet makes no sense. */
  .orion-resize-w, .orion-resize-e, .orion-resize-h, .orion-resize-corner { display: none; }
  .orion-head { cursor: default; }
  /* The tooltip would sit off-screen beside a 34px target at this width. */
  .orion-tooltip { display: none; }
}

/* A record card is a three-column row at full width; at phone width the
   identity column stacks above the status so the name is not squeezed to
   two words per line. */
@media (max-width: 720px) {
  .mrecord .rrow, .mtenants .rrow { grid-template-columns: 1fr; gap: var(--spacing-xxs); }
  .mrecord .rrow > *, .mtenants .rrow > * { justify-self: start; }
}

/* Jump to the latest — a 32px disc floating over the foot of the conversation,
   centred, clear of the composer. White on the same border-primary hairline as
   every other surface, with a lift rather than a border shadow because it is
   genuinely floating over content. radius-round; the chevron is the library's
   own keyboard-arrow-down at 20. */
.jump-latest {
  /* Anchored to the composer, so it rides 8px above the divider over the
     Prompt Suggestions row wherever that line ends up — rather than to the
     panel, where it sat over the footer. bottom:100% puts it on the line;
     the margin lifts it clear. */
  position:absolute; left:50%; transform:translateX(-50%);
  /* bottom:100% resolves against the composer's PADDING box, which starts
     below its 1px top border — so the raw 8px lands 7px above the line.
     The extra pixel clears the border itself. */
  bottom:calc(100% + 1px); margin-bottom:var(--spacing-xs); z-index:9;
  width:32px; height:32px; padding:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--container-primary);
  border:1px solid var(--border-primary);
  border-radius:var(--radius-round);
  color:var(--text-secondary); cursor:pointer;
  box-shadow: 0 2px 4px rgba(76,76,76,.10), 0 6px 14px rgba(76,76,76,.12);
  animation: eh-in .16s ease-out;
}
.jump-latest:hover { border-color:var(--border-secondary); color:var(--text-link); }
.jump-latest[hidden] { display:none; }

/* ==== Dim behind the assistant ====
   The panel sits over the app and the app keeps showing through, which makes
   a long answer hard to read against a busy workspace. Navy rather than a
   generic black, so it reads as the same family of surface. The v3 Writing
   Assistant overlay dims to 28%; this goes to 45% so the panel is clearly
   the only live surface while someone is following a demo.

   It sits under the panel (z-index 49 against the panel's 50) and above the
   app bar, and clicking it closes the assistant, which is what a dimmed
   backdrop implies. The panel stays draggable and resizable on top of it. */
.orion-scrim {
  position: fixed;
  inset: 0;
  z-index: 49;
  background: rgba(19, 49, 76, .45);
  animation: orion-scrim-in .18s ease-out;
}
.orion-scrim[hidden] { display: none; }
@keyframes orion-scrim-in { from { opacity: 0; } to { opacity: 1; } }

/* The print dialog opens over the assistant, so it needs to clear the scrim. */
#printOverlay { z-index: 300; }

/* Focus — Input Field, DESIGN.md §7.1: the border goes brand blue. On the ask
   fields the border is on the wrapper, not the textarea, so :focus-within is
   what carries it. */
.home-ask:focus-within,
.orion-ask:focus-within { border-color: var(--border-secondary); }
.home-ask textarea:focus,
.orion-ask textarea:focus { outline: none; }

</style>

<script>
/* RMX prototype behaviour layer — the same file in every prototype.

   Screens stay declarative: you write markup with data- attributes, this
   wires the behaviour. Nothing here is app logic, and nothing here invents
   a visual. Every class it touches is already defined in rmx.css.

   Why it exists: without it, each designer hand-writes a different toggle
   in each screen and the prototypes stop behaving alike. It is also the
   part a developer can throw away cleanly — the markup is the deliverable,
   this is the fake wiring around it.

   Never use alert(), confirm() or prompt() in a prototype. Use RMX.toast().
*/
(function () {
  'use strict';

  const $  = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

  /* ---------- tabs ----------
     <div class="rmx-tabrow" data-rmx-tabs>
       <button class="rmx-tab" aria-selected="true" data-panel="summary">Summary</button>
     </div>
     <section data-tab-panel="summary">…</section>                       */
  function tabs() {
    $$('[data-rmx-tabs]').forEach(row => {
      row.addEventListener('click', e => {
        const tab = e.target.closest('.rmx-tab[data-panel]');
        if (!tab || !row.contains(tab)) return;
        $$('.rmx-tab', row).forEach(t => t.setAttribute('aria-selected', String(t === tab)));
        const scope = row.closest('[data-rmx-tabscope]') || document;
        $$('[data-tab-panel]', scope).forEach(p => {
          p.hidden = p.dataset.tabPanel !== tab.dataset.panel;
        });
      });
    });
  }

  /* ---------- dropdowns ----------
     Never a native <select> — that is an audit error. Instead:
     <div data-rmx-dropdown>
       <button class="rmx-field__box" data-rmx-trigger>Status<svg …></button>
       <div class="rmx-menu" data-rmx-menu hidden>
         <button data-value="active">Active</button>
       </div>
     </div>
     Choosing an option writes its text into [data-rmx-value] (or the
     trigger itself) and fires an `rmx:select` event on the wrapper.       */
  function dropdowns() {
    $$('[data-rmx-dropdown]').forEach(dd => {
      const trigger = $('[data-rmx-trigger]', dd) || dd.firstElementChild;
      const menu    = $('[data-rmx-menu]', dd);
      if (!trigger || !menu) return;

      trigger.addEventListener('click', e => {
        e.stopPropagation();
        const open = !menu.hidden;
        closeAllMenus();
        menu.hidden = open;
        dd.dataset.open = String(!open);
      });

      menu.addEventListener('click', e => {
        const opt = e.target.closest('[data-value]');
        if (!opt) return;
        const label = $('[data-rmx-value]', dd) || trigger;
        const slot = $('[data-rmx-value]', label) || label;
        if (slot.firstChild && slot.firstChild.nodeType === 3) slot.firstChild.nodeValue = opt.textContent.trim();
        else slot.textContent = opt.textContent.trim();
        slot.classList.remove('rmx-placeholder');
        $$('[data-value]', menu).forEach(o => o.setAttribute('aria-selected', String(o === opt)));
        menu.hidden = true;
        dd.dataset.open = 'false';
        dd.dispatchEvent(new CustomEvent('rmx:select', {
          bubbles: true, detail: { value: opt.dataset.value, label: opt.textContent.trim() }
        }));
      });
    });
  }

  function closeAllMenus() {
    $$('[data-rmx-menu]').forEach(m => { m.hidden = true; });
    $$('[data-rmx-dropdown]').forEach(d => { d.dataset.open = 'false'; });
  }

  /* ---------- overlays and panels ----------
     <button data-rmx-open="add-charge">Add charge</button>
     <div class="rmx-overlay" id="add-charge" hidden>… <button data-rmx-close>  */
  function overlays() {
    document.addEventListener('click', e => {
      const opener = e.target.closest('[data-rmx-open]');
      if (opener) {
        e.preventDefault();
        openOverlay(opener.dataset.rmxOpen);
        return;
      }
      if (e.target.closest('[data-rmx-close]')) {
        e.preventDefault();
        closeOverlay(e.target.closest('.rmx-overlay, [data-rmx-panel]'));
      }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeAllMenus(); closeOverlay(); }
    });
  }

  function scrim() {
    let s = $('.rmx-scrim');
    if (!s) {
      s = document.createElement('div');
      s.className = 'rmx-scrim';
      s.hidden = true;
      s.addEventListener('click', () => closeOverlay());
      document.body.appendChild(s);
    }
    return s;
  }

  function openOverlay(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.hidden = false;
    el.classList.add('is-open');
    scrim().hidden = false;
    const f = $('input, button, [tabindex]', el);
    if (f) f.focus();
  }

  function closeOverlay(el) {
    const targets = el ? [el] : $$('.rmx-overlay.is-open, [data-rmx-panel].is-open');
    targets.forEach(t => { t.classList.remove('is-open'); t.hidden = true; });
    if (!$('.rmx-overlay.is-open, [data-rmx-panel].is-open')) scrim().hidden = true;
  }

  /* ---------- checkboxes, radios, register select-all ----------
     RMX draws its own; a native one is an audit error. A checked box is
     orange (--icon-attention) except the select-all above a register,
     which is blue — that is the rmx-check--register modifier, not a
     colour you set here.                                                  */
  function choices() {
    document.addEventListener('click', e => {
      const check = e.target.closest('.rmx-check');
      if (check && !check.hasAttribute('data-static')) {
        const on = check.dataset.checked !== 'true';
        check.dataset.checked = String(on);
        const all = check.closest('[data-rmx-selectall]');
        if (all) {
          const table = document.getElementById(all.dataset.rmxSelectall) || all.closest('.rmx-tile, section');
          if (table) $$('.rmx-check', table).forEach(c => { if (c !== check) c.dataset.checked = String(on); });
        }
        check.dispatchEvent(new CustomEvent('rmx:change', { bubbles: true, detail: { checked: on } }));
        return;
      }
      const radio = e.target.closest('.rmx-radio');
      if (radio && !radio.hasAttribute('data-static')) {
        const group = radio.closest('[data-rmx-radiogroup]') || document;
        $$('.rmx-radio', group).forEach(r => { r.dataset.checked = String(r === radio); });
      }
    });
  }

  /* ---------- register sort ----------
     <th data-sort="text|number|date">Tenant</th>                          */
  function sorting() {
    $$('.rmx-register').forEach(table => {
      const head = $('thead', table);
      if (!head) return;
      head.addEventListener('click', e => {
        const th = e.target.closest('th[data-sort]');
        if (!th) return;
        const body = $('tbody', table);
        if (!body) return;
        const idx = Array.from(th.parentNode.children).indexOf(th);
        const dir = th.dataset.dir === 'asc' ? 'desc' : 'asc';
        $$('th[data-sort]', head).forEach(h => delete h.dataset.dir);
        th.dataset.dir = dir;
        const val = tr => {
          const raw = (tr.children[idx]?.textContent || '').trim();
          if (th.dataset.sort === 'number') return parseFloat(raw.replace(/[^0-9.\-]/g, '')) || 0;
          if (th.dataset.sort === 'date') return new Date(raw).getTime() || 0;
          return raw.toLowerCase();
        };
        Array.from(body.rows)
          .sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * (dir === 'asc' ? 1 : -1))
          .forEach(r => body.appendChild(r));
        restripe(body);
      });
    });
  }

  /* Striping is OPT-IN and always was in the design system — a register is
     not striped unless the design says so. Earlier this ran on every register
     automatically, which put zebra stripes on screens nobody asked for.
     Opt in per table with <table class="rmx-register" data-rmx-striped>. */
  function restripe(body) {
    const table = body.closest('.rmx-register');
    if (!table || !table.hasAttribute('data-rmx-striped')) return;
    let i = 0;
    for (const r of body.rows) { if (!r.hidden) { r.dataset.striped = String(i % 2 === 1); i++; } }
  }

  /* ---------- filtering ----------
     <input data-rmx-filter="#charges"> filters rows of that table/list.
     Also updates any [data-rmx-count="#charges"] with the visible count.  */
  function filtering() {
    $$('[data-rmx-filter]').forEach(input => {
      input.addEventListener('input', () => {
        const target = $(input.dataset.rmxFilter);
        if (!target) return;
        const q = input.value.trim().toLowerCase();
        const rows = $$('tbody tr, [data-rmx-row]', target);
        let shown = 0;
        rows.forEach(r => {
          const hit = !q || r.textContent.toLowerCase().includes(q);
          r.hidden = !hit;
          if (hit) shown++;
        });
        const body = $('tbody', target);
        if (body) restripe(body);
        $$(`[data-rmx-count="${input.dataset.rmxFilter}"]`).forEach(c => { c.textContent = shown; });
        const empty = $('[data-rmx-empty]', target) || document.querySelector(`[data-rmx-empty="${input.dataset.rmxFilter}"]`);
        if (empty) empty.hidden = shown !== 0;
      });
    });
  }

  /* ---------- toasts ----------
     RMX.toast('Charge added', 'success')  — success | failure | neutral    */
  function toast(message, kind = 'neutral', ms = 3200) {
    let stack = $('.rmx-toaststack');
    if (!stack) {
      stack = document.createElement('div');
      stack.className = 'rmx-toaststack';
      document.body.appendChild(stack);
    }
    const el = document.createElement('div');
    el.className = 'rmx-toast' + (kind === 'neutral' ? '' : ` rmx-toast--${kind}`);
    el.setAttribute('role', 'status');
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(() => { el.remove(); }, ms);
    return el;
  }

  /* ---------- unwired affordances ----------
     Anything marked data-rmx-todo says so instead of doing nothing
     silently — a stakeholder clicking a dead button assumes it is broken. */
  function todos() {
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-rmx-todo]');
      if (!el) return;
      e.preventDefault();
      toast(el.dataset.rmxTodo || 'Not built in this prototype', 'neutral');
    });
  }

  /* ---------- icons ----------
     Screens reference the shared symbol sheet: <svg class="rmx-icon">
     <use href="#chevron-down"></use></svg>
     bundle.mjs rewrites those into inlined symbols when publishing, so the
     same markup works in a repo and in a published page.                  */

  document.addEventListener('click', e => {
    if (!e.target.closest('[data-rmx-dropdown]')) closeAllMenus();
  });

  function init(root) {
    tabs(); dropdowns(); overlays(); choices(); sorting(); filtering(); todos();
    $$('.rmx-register[data-rmx-striped] tbody').forEach(restripe);
  }

  window.RMX = { init, toast, openOverlay, closeOverlay, restripe };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => init());
  else init();
})();

</script>
<script>
/* ============================================================
   Printed report — the document builder
   ------------------------------------------------------------
   Turns a report id into paginated .rpt-page documents, laid out per the
   Rent Manager Reports Guide (Figma "Reports Guide", Report with Sections).
   A report is a DOCUMENT, not an Express screen: it keeps the report
   engine's own type scale and colour, which is why proto.css holds those
   values as literals rather than RMX tokens.

   Loaded on every screen, because the Orion panel shows report metadata
   and page counts inline in a conversation, and the print dialog renders
   these same pages — neither of which requires the report viewer itself.
   ============================================================ */

/* ============================================================
   Report generation + the report viewer
   ------------------------------------------------------------
   PDF on a result Orion analyzed builds the report and opens it
   on screen — the same move the Orion Report Analysis prototype
   makes, where Orion writes a summary and it becomes a page of
   the report you are reading. Here the summary already exists,
   because the conversation is what produced it, so it is page 1.
   Print skips straight to the print overlay instead (see output()
   and openPrintOverlay(), below the report data builders).

   The pages are .rpt-page documents: the Reports Guide template
   above, rendered from the same records the chat answer showed.
   Nothing here is an exported image — the thumbnail rail and the
   print overlay both hold live clones of the same pages.

   Only q1 has a hand-built page (buildOccupancySummaryReport).
   Every other result is laid out by the generic builder below,
   which fills each sheet by measuring an off-screen page rather
   than estimating heights — see rptLayout.
   ============================================================ */
const RV_ZOOMS = [50, 75, 100, 125, 150, 200];
const RV_THUMB_SCALE = 120/816;  /* thumbnail box width over page width */
let RPT = { id:null, meta:null, count:1, page:1, zoom:2, reopenOrion:false, summaryPos:null, summaryHtml:null };

function rptMeta(id){
  const p = PROMPTS[id] || {};
  return {
    id: id,
    name: p.reportName || p.tileName || 'Result Summary',
    source: p.reportSource || 'Custom · built from this result',
    options: (p.reportSource || 'Custom · built from this result') + ' — 10 properties selected · class60',
    dateRange: 'As of Aug 28, 2026',
    params: [
      ['Report', p.reportSource || 'Custom · built from this result'],
      ['Properties', '10 selected · class60'],
      ['As of', 'Aug 28, 2026 · day 18 of period'],
      ['Layout', 'Summary with detail rows, portrait, letter'],
    ],
    builtFrom: p.label || 'this result',
  };
}

/* ---------- The rest: parameters and whatever the result was ---------- */
function rptDataBlocks(p, m){
  const B = [];
  const band = label => B.push({ t:'band', label:label });
  const isMoney = s => /^-?\$[\d,]+(\.\d+)?$/.test(String(s == null ? '' : s).trim());
  const toNum = s => parseFloat(String(s).replace(/[$,]/g, ''));
  const asMoney = n => (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });

  /* A detail grid, closed with the total a printed report is expected to
     carry and the chat answer never showed. */
  function detail(label, head, rows){
    if (!rows || !rows.length) return;
    const wide = rows[0].length > 2;
    const g = wide ? '1.45fr 1.45fr .6fr' : '1fr 1fr';
    band(label);
    B.push({ t:'cols', grid:g, cells: wide ? head : head.slice(0,2), amounts: wide ? [2] : [] });
    rows.forEach(r => B.push({ t:'row', grid:g, amounts: wide ? [2] : [],
      cells: wide ? [r[0], r[1], r[2]] : [r[0], r[1]],
      tone:r[3], toneCol:2, muted:[1],
      wrap: String(r[0]).length + String(r[1]).length > 74 }));
    const count = rows.length + (rows.length === 1 ? ' record' : ' records');
    B.push({ t:'total', grid:g, amounts: wide ? [2] : [],
      cells: wide
        ? [count, '', rows.every(r => isMoney(r[2])) ? asMoney(rows.reduce((s,r)=>s + toNum(r[2]), 0)) : '']
        : [count, ''] });
  }

  band('Report Parameters');
  m.params.forEach(r => B.push({ t:'kv', l:r[0], v:r[1] }));
  B.push({ t:'kv', l:'Built by', v:'Orion Assistant · from “' + m.builtFrom + '”' });

  if (p.plan){
    band(p.plan.title);
    p.plan.rows.forEach(r => B.push({ t:'kv', l:r[0], v:r[1] }));
    if (p.plan.warn) B.push({ t:'para', text:'Exception: ' + p.plan.warn });
  }

  if (p.report){
    const g = '1.7fr .85fr .85fr .5fr';
    band(p.report.title);
    B.push({ t:'cols', grid:g, cells:['Account'].concat(p.report.cols), amounts:[1,2,3] });
    p.report.rows.forEach(r => {
      if (r.kind === 'head'){ B.push({ t:'sect', grid:g, cells:[r.a, '', '', ''] }); return; }
      B.push({ t: r.kind === 'total' ? 'total' : 'row', grid:g, cells:[r.a, r.b, r.c, r.d], amounts:[1,2,3],
        tone: r.dir === 'bad' ? RED : r.dir === 'up' ? GREEN : GRAY, toneCol:3 });
    });
  }

  if (p.tenants && p.tenants.length){
    const g = '1fr 1.15fr 1.6fr .6fr';
    band('Vehicle Register');
    B.push({ t:'cols', grid:g, cells:['Tenant','Unit','Vehicle on file','Match'] });
    p.tenants.forEach(t => B.push({ t:'row', grid:g, muted:[1,2],
      cells:[t.name, t.unit, t.vehicle, t.match === 'exact' ? 'Exact' : 'Partial'],
      tone: t.match === 'exact' ? GREEN : GRAY, toneCol:3 }));
    B.push({ t:'total', grid:g, cells:[p.tenants.length + ' vehicles on file', '', '', ''] });
  }

  if (p.unitList){
    const g = '1.35fr .6fr .7fr .7fr';
    band('Units Vacating · Next 30 Days');
    B.push({ t:'cols', grid:g, cells:['Unit','Vacant','Applications','Interest'], amounts:[2,3] });
    UNITS.forEach(u => B.push({ t:'row', grid:g, amounts:[2,3], muted:[1],
      cells:[u.unit + ' · ' + u.property, u.vacant, u.apps === 0 ? 'None' : u.apps + ' pending',
             u.interest === 0 ? 'None' : u.interest + ' interested'],
      tone: u.interest === 0 ? RED : u.interest < 3 ? ORANGE : GREEN, toneCol:3 }));
    B.push({ t:'total', grid:g, amounts:[2,3],
      cells:[UNITS.length + ' units vacating', '', UNITS.reduce((s,u)=>s+u.apps,0) + ' pending', UNITS.reduce((s,u)=>s+u.interest,0) + ' interested'] });
  } else {
    /* tileRows are the dashboard tile's summary of the same numbers, so they
       only stand in as the detail grid when there is no table and no statement. */
    detail('Detail', p.tileHead || ['Record','Detail','Value'], p.table || (p.report ? null : p.tileRows));
  }

  if (p.posted){
    band('Posting Results');
    B.push({ t:'para', text:p.posted.text });
    if (p.posted.stats) B.push({ t:'stats', items:p.posted.stats });
    if (p.posted.table) detail('Posted Records', ['Record','Reference','Amount'], p.posted.table);
    if (p.posted.note) B.push({ t:'para', text:p.posted.note });
  }

  return B;
}

/* ---------- Rendering, in the Reports Guide's own markup ---------- */
function rptToneClass(t){ return t === RED ? 'tone-red' : t === ORANGE ? 'tone-amber' : t === GREEN ? 'tone-green' : ''; }

function rptCells(b){
  const amounts = b.amounts || [], muted = b.muted || [];
  return b.cells.map((c,i) => {
    const cls = ['rpt-cell'];
    if (amounts.indexOf(i) >= 0) cls.push('amount');
    if (muted.indexOf(i) >= 0) cls.push('muted');
    if (b.tone && b.toneCol === i){ const tc = rptToneClass(b.tone); if (tc) cls.push(tc); }
    return `<div class="${cls.join(' ')}">${esc(c)}</div>`;
  }).join('');
}

function rptBlockHtml(b){
  switch (b.t){
    case 'orion': return `<div class="rptx-orion">${orionMark(16)}<span class="t">Written by Orion Assistant on Aug 28, 2026 from the result it analyzed. AI may be inaccurate — verify before distributing.</span></div>`;
    case 'para':  return `<p class="rptx-para">${esc(b.text)}</p>`;
    case 'stats': return `<div class="rptx-stats">${b.items.map(s=>`<div class="rptx-stat"><div class="v">${esc(s[0])}</div><div class="l">${esc(s[1])}</div></div>`).join('')}</div>`;
    case 'li':    return `<div class="rptx-li"><span class="n">${b.bullet ? '&bull;' : esc(b.n + '.')}</span><span class="t">${esc(b.text)}</span></div>`;
    case 'kv':    return `<div class="rpt-row" style="grid-template-columns:170px 1fr"><div class="rpt-cell muted">${esc(b.l)}</div><div class="rpt-cell">${esc(b.v)}</div></div>`;
    case 'cols':  return `<div class="rpt-row rpt-headrow" style="grid-template-columns:${b.grid}">${rptCells(b)}</div>`;
    case 'row':   return `<div class="rpt-row" style="grid-template-columns:${b.grid}">${rptCells(b)}</div>`;
    case 'total': return `<div class="rpt-row rpt-total" style="grid-template-columns:${b.grid}">${rptCells(b)}</div>`;
    case 'sect':  return `<div class="rpt-row rptx-sub" style="grid-template-columns:${b.grid}">${rptCells(b)}</div>`;
  }
  return '';
}

/* The sheet itself: the Reports Guide page, wrapped around already-laid-out
   section markup. */
function rptPageShell(bodyHtml, n, total, m){
  return `<div class="rpt-page" data-rpt-page="${n}">
    <div class="rpt-header">
      <div class="rpt-title-row"><span class="rpt-title">${esc(m.name)}</span><span class="rpt-daterange">${esc(m.dateRange)}</span></div>
      <div class="rpt-options">${esc(m.options)}</div>
    </div>
    <div class="rpt-body">${bodyHtml}</div>
    <div class="rpt-footer">
      <div class="rpt-foot-left">
        <svg class="rmx-icon rpt-foot-ico"><use href="#properties"></use></svg>
        <span>RentManager.com</span><span>08/28/26</span><span>7:14 AM</span>
      </div>
      <div class="rpt-foot-page">${n} of ${total}</div>
    </div>
  </div>`;
}

/* ---------- Layout: measured, not estimated ----------
   Blocks are appended to a real off-screen page whose body is pinned to the
   height a letter sheet actually leaves, and a block that pushes past it moves
   to the next sheet. So the page count, the thumbnail rail and the printed
   document agree by construction — there is no cost table to keep in sync with
   the CSS, and nothing reflows after the fact.

   Two typographic rules are enforced while filling:
   - a section label alone at the foot of a sheet is carried to the next one
     rather than left as a widow;
   - a table that crosses a sheet repeats its section label as "(continued)"
     and its column header, the way a printed report does. */
function rptMeasureHost(){
  let host = document.getElementById('rptMeasure');
  if (!host){
    host = document.createElement('div');
    host.id = 'rptMeasure';
    host.setAttribute('aria-hidden', 'true');
    host.style.cssText = 'position:absolute;left:-99999px;top:0;width:816px;pointer-events:none;';
    document.body.appendChild(host);
  }
  return host;
}

function rptLayout(blocks, m){
  const host = rptMeasureHost();
  host.innerHTML = rptPageShell('', 1, 1, m);
  const page = host.firstElementChild;
  page.style.height = '1056px';
  const body = page.querySelector('.rpt-body');
  const avail = body.clientHeight;      /* what the sheet leaves after chrome */
  body.style.flex = 'none';
  body.style.height = avail + 'px';
  body.style.overflow = 'hidden';

  const newSection = () => {
    const el = document.createElement('div');
    el.className = 'rpt-section';
    body.appendChild(el);
    return el;
  };
  let section = null, lastBand = null, lastCols = null;
  const sheets = [];
  const overflows = () => body.scrollHeight > body.clientHeight + 1;

  function place(b){
    if (b.t === 'band'){
      const el = newSection();
      el.innerHTML = `<div class="rpt-section-label"><span class="lbl">${esc(b.label)}${b.cont ? ' (continued)' : ''}</span></div>`;
      section = el;
      return el;
    }
    if (!section) section = newSection();
    const holder = document.createElement('div');
    holder.innerHTML = rptBlockHtml(b);
    const el = holder.firstElementChild;
    if (el) section.appendChild(el);
    return el;
  }

  function commit(){
    Array.from(body.querySelectorAll('.rpt-section')).forEach(sec => { if (!sec.children.length) sec.remove(); });
    if (body.children.length) sheets.push(body.innerHTML);
    body.innerHTML = '';
    section = null;
  }

  blocks.forEach(b => {
    if (b.t === 'band'){ lastBand = b; lastCols = null; }
    if (b.t === 'cols'){ lastCols = b; }

    const prevSection = section;
    const added = place(b);
    if (!overflows()) return;

    /* Roll the block back off this sheet. */
    if (added && added.parentNode) added.parentNode.removeChild(added);
    if (b.t === 'band') section = prevSection;

    /* A label with nothing under it travels to the next sheet instead. */
    let carry = null;
    if (section && section.children.length === 1 && section.firstElementChild.classList.contains('rpt-section-label')){
      carry = section;
      if (carry.parentNode) carry.parentNode.removeChild(carry);
      section = null;
    }

    /* One block taller than a whole sheet: keep it and let it be tall. */
    if (!body.querySelector('.rpt-section > *')){
      if (carry) { body.appendChild(carry); section = carry; }
      place(b);
      return;
    }

    commit();
    if (carry){ body.appendChild(carry); section = carry; }
    else {
      if (b.t !== 'band' && lastBand) place({ t:'band', label:lastBand.label, cont:true });
      if (b.t !== 'cols' && lastCols) place(lastCols);
    }
    place(b);
  });
  commit();

  host.innerHTML = '';
  return sheets.length ? sheets : [''];
}

/* A hand-built page carries its own "1 of 1" — renumber it for the sheet it
   actually lands on, and tag it so the viewer can find it. */
function rptStampPage(html, n, total){
  return html
    .replace(/(class="rpt-foot-page"[^>]*>)[^<]*(<)/, '$1' + n + ' of ' + total + '$2')
    .replace(/class="rpt-page"/, `class="rpt-page" data-rpt-page="${n}"`);
}

/* The whole report, one HTML string per sheet. */
function rptPages(id){
  const p = PROMPTS[id] || {}, m = rptMeta(id);
  const sheets = [];
  const bespoke = PRINT_REPORTS[id];
  if (bespoke){
    const built = bespoke();
    (Array.isArray(built) ? built : [built]).forEach(html => sheets.push({ whole: html }));
  }
  else rptLayout(rptDataBlocks(p, m), m).forEach(html => sheets.push({ body:html }));

  /* Not a default page anymore — only present once Add to Report has been
     used (see addToReport()), and only at the position chosen there. */
  if (RPT.id === id && RPT.summaryPos){
    const summaryBody = `<div class="rpt-section"><div class="rpt-section-label"><span class="lbl">Executive Summary</span></div><div class="rv-analysis-page">${RPT.summaryHtml}</div></div>`;
    if (RPT.summaryPos === 'first') sheets.unshift({ body:summaryBody });
    else sheets.push({ body:summaryBody });
  }

  const total = sheets.length;
  return sheets.map((s,i) => s.whole ? rptStampPage(s.whole, i+1, total) : rptPageShell(s.body, i+1, total, m));
}

function rptPageCount(id){ return rptPages(id).length; }

/* ---------- The viewer ---------- */
</script>

   (see saveConversation/restoreConversation at the foot of this file).

   The panel is Orion's own surface. RMX Components ships Orion Action Bar,
   Chat Bubble, Tag and Overlay, but not an assembled assistant panel, so
   its markup is prototype-specific and lives in proto.css. Everything it
   renders INTO the page — buttons, lozenges, registers, field grids — is a
   real RMX component and is tagged as one.

   Data, rendering and interaction below are ported from the Orion Assistant
   Claude Design canvas (orion-design-export/Orion Assistant Panel.dc.html).
   ============================================================ */

/* ---------- the ask field ----------
   Orion_Input Fields (Figma 2983:17176) is a horizontal auto-layout box whose
   children align to the BOTTOM of the cross axis — which is what keeps the
   send arrow on the last line as the text wraps. In CSS that is
   align-items: flex-end; here we only have to grow the field itself.

   A <textarea> has no intrinsic "fit content" height, so it is reset to one
   row and then set to its own scrollHeight. Capped, after which it scrolls,
   because the panel is only so tall. */
const ASK_MAX_H = 132;   /* ~6 lines before it starts scrolling */

/* Width the panel opens at. It normally lines up with the app bar's icon
   cluster, but that comes out around 380 — narrow enough that the footer's
   "Need more help? View all documentation at Express Help" wraps to two
   lines. 528 is the smallest 4px-grid width that keeps it on one line:
   355 of text + 12 gap + 120 button + 36 padding + 2 border. Dragging the
   panel narrower than this is still allowed; this is only the starting size. */
const ORION_OPEN_MIN_W = 528;

function growAsk(el) {
  if (!el) return;
  el.style.height = 'auto';
  const h = Math.min(el.scrollHeight, ASK_MAX_H);
  el.style.height = h + 'px';
  el.style.overflowY = el.scrollHeight > ASK_MAX_H ? 'auto' : 'hidden';
  /* The composer just changed height, and it is what the body pads for. */
  syncComposerInset();
}

/* Enter sends, Shift+Enter starts a new line — the convention for every chat
   input, and the reason this is a textarea rather than an input. */
function askKey(e, submit) {
  if (e.key !== 'Enter' || e.shiftKey) return;
  e.preventDefault();
  submit();
}

/* Reset to a single row after sending, or the empty field keeps the height of
   whatever was just sent. */
function resetAsk(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.height = 'auto';
  el.style.overflowY = 'hidden';
}


/* While the assistant is open the page behind it does not scroll — only the
   conversation does. The scrim already stops clicks reaching the page; this
   stops the wheel, which otherwise scrolls the workspace out from under the
   panel and makes the dim look broken.

   Keeping the scrollbar's width as padding avoids the page jumping sideways
   as it locks, which is the usual giveaway of a crude overflow:hidden. */
function lockPageScroll(on) {
  const b = document.body, h = document.documentElement;
  if (on) {
    if (b.dataset.scrollLocked) return;
    const gap = window.innerWidth - h.clientWidth;
    b.dataset.scrollLocked = '1';
    b.dataset.prevPaddingRight = b.style.paddingRight || '';
    /* Both, not just body: the page scrolls on the ROOT element, so locking
       body alone leaves the wheel working — which is what happened first. */
    h.style.overflow = 'hidden';
    b.style.overflow = 'hidden';
    if (gap > 0) b.style.paddingRight = gap + 'px';
  } else {
    if (!b.dataset.scrollLocked) return;
    h.style.overflow = '';
    b.style.overflow = '';
    b.style.paddingRight = b.dataset.prevPaddingRight || '';
    delete b.dataset.scrollLocked;
    delete b.dataset.prevPaddingRight;
  }
}

function mountOrionPanel() {
  if (document.getElementById('orionPanel')) return;
  const host = document.createElement('div');
  host.innerHTML = '<div class="orion-scrim" id="orionScrim" hidden onclick="closeOrion()"></div>'
                 + ORION_PANEL_HTML + ORION_PRINT_OVERLAY_HTML;
  while (host.firstChild) document.body.appendChild(host.firstChild);
}
mountOrionPanel();

/* The Orion mark at an arbitrary size. Replaces the old logoSvg(), which
   inlined the whole five-path mark on every call — the geometry now lives
   once, as #orion in assets/icons-local.svg. */
function orionMark(px) {
  return '<svg class="rmx-icon" style="width:' + px + 'px;height:' + px + 'px"><use href="#orion"></use></svg>';
}

/* Repoint an existing <svg class="rmx-icon"><use> at a different symbol. */
function setIconGlyph(id, symbol) {
  const use = document.querySelector('#' + id + ' use');
  if (use) use.setAttribute('href', '#' + symbol);
}

  { name:'Lease Renewals', meta:'6 tiles · shared with your team' },

const ACTION_LABELS = {
  nextsteps:['Suggest next steps', false], tile:['Create a dashboard tile', false], list:['Show me the full list', false],
  article:['Open the article', true], browse:['Prompt Suggestions', false],
  post:['Post the charges', true], postbills:['Create the bills', true], held:['Why are 4 held back?', false],
  print:['Print a report', false], flagged:['Remove the 2 flagged tenants', false], cancel:['Do not post', false],
  summarize:['Summarize', false],
  post_credit:['Post the credits', true], log_violation:['Log the violation', true],
  apply_priorities:['Apply these priorities', true], send_drafts:['Send the drafts', true],
